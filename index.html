<!DOCTYPE html>
<html lang="en">
<head>

      body { align-items: center; padding: 24px 0; }

    input, select, button { font-family: inherit; outline: none; -webkit-appearance: none; }
    button { cursor: pointer; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── TOKENS ───────────────────────────────────────────────────────────────────
// ── OPTION A PALETTE: Warm Slate & Terracotta ────────────────────────────────
const T = {

// ── DATA ─────────────────────────────────────────────────────────────────────
// Demo member pool — used to populate the household based on count chosen in onboarding
const MEMBER_COLORS = [
  {color:T.teal,  bg:T.teal10 },
  {color:T.blue,  bg:T.blue10 },
  {color:T.amber, bg:T.amber10},
  {color:"#8B5CF6", bg:"#F5F3FF"},
  {color:T.mint,  bg:"#ECFDF5" },
];
const DEMO_NAMES = [
  {name:"Xiaowan S.",   short:"Xiaowan",    initials:"XS"},
  {name:"Sam R.",    short:"Sam",     initials:"SR"},
  {name:"Jordan T.", short:"Jordan",  initials:"JT"},
  {name:"Alex P.",   short:"Alex",    initials:"AP"},
];

// Build member list: member 1 = current user (initiator), rest = demo names up to cnt
function buildMembers(currentUser, cnt) {
  const me = {
    id:1,
    name: currentUser.name.includes(" ") ? currentUser.name : currentUser.name + " L.",
    short: currentUser.name.split(" ")[0],
    initials: currentUser.initials || currentUser.name.slice(0,2).toUpperCase(),
    color: T.teal, bg: T.teal10, role:"Initiator",
  };
  const others = Array.from({length: cnt - 1}, (_, i) => ({
    id: i + 2,
    ...DEMO_NAMES[i] || {name:`Member ${i+2}`, short:`M${i+2}`, initials:`M${i+2}`},
    ...MEMBER_COLORS[i + 1] || MEMBER_COLORS[1],
    role: "Member",
  }));
  return [me, ...others];
}

// Default members for screens that need them before App state is ready
const MEMBERS_DEFAULT = [
  { id:1, name:"Leticia L.", short:"Leticia", initials:"LL", color:T.teal,  bg:T.teal10,  role:"Initiator" },
  { id:2, name:"Xiaowan S.",    short:"Xiaowan",    initials:"XS", color:T.blue,  bg:T.blue10,  role:"Member" },
  { id:3, name:"Sam R.",     short:"Sam",     initials:"SR", color:T.amber, bg:T.amber10, role:"Member" },
];

// ── UI ATOMS ─────────────────────────────────────────────────────────────────
function Av({m, size=36}) {
  return <div style={{width:size,height:size,borderRadius:"50%",background:m.bg,border:`2px solid ${m.color}33`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*0.33,fontWeight:700,color:m.color,flexShrink:0,letterSpacing:-0.5}}>{m.initials}</div>;
}
function Pill({label,color=T.teal}) {
  return <span style={{display:"inline-flex",alignItems:"center",fontSize:11,fontWeight:600,padding:"3px 10px",borderRadius:20,background:color+"18",color,whiteSpace:"nowrap"}}>{label}</span>;
}
function Bar({pct,color=T.teal,h=5}) {
  return <div style={{background:T.g100,borderRadius:99,height:h,overflow:"hidden"}}><div style={{width:`${pct}%`,height:"100%",background:color,borderRadius:99,transition:"width 0.5s"}}/></div>;
}
function Ring({pct,size=64,sw=5,color=T.teal}) {
  const r=(size-sw*2)/2,c=2*Math.PI*r,d=(pct/100)*c;
  return <svg width={size} height={size}><circle cx={size/2} cy={size/2} r={r} fill="none" stroke={T.g100} strokeWidth={sw}/><circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={sw} strokeDasharray={`${d} ${c}`} strokeDashoffset={c*0.25} strokeLinecap="round" style={{transition:"stroke-dasharray 0.5s"}}/><text x={size/2} y={size/2+5} textAnchor="middle" fill={color} fontSize={size*0.22} fontWeight={700} fontFamily="Inter">{pct}%</text></svg>;
}
function Card({children,style={},border,onClick}) {
  return <div onClick={onClick} style={{background:T.white,borderRadius:16,border:`1px solid ${border||T.g200}`,boxShadow:"0 1px 4px rgba(0,0,0,0.06)",overflow:"hidden",cursor:onClick?"pointer":undefined,...style}}>{children}</div>;
}
function TopBar({title,sub,back,right}) {
  return <div style={{background:T.white,borderBottom:`1px solid ${T.g100}`,padding:"14px 20px",display:"flex",alignItems:"center",gap:10,position:"sticky",top:0,zIndex:20}}>
    {back&&<button onClick={back} style={{background:"none",border:"none",color:T.g500,display:"flex",alignItems:"center",marginLeft:-4,marginRight:2}}>{Icon.arrowL}</button>}
    <div style={{flex:1,minWidth:0}}>
      <div style={{fontSize:17,fontWeight:700,color:T.g900,lineHeight:1.2}}>{title}</div>
      {sub&&<div style={{fontSize:12,color:T.g400,marginTop:2}}>{sub}</div>}
    </div>
    {right}
  </div>;
}
function Sec({label}) {
  return <div style={{fontSize:11,fontWeight:700,color:T.g400,letterSpacing:1,textTransform:"uppercase",padding:"16px 20px 8px"}}>{label}</div>;
}
const inp = {width:"100%",border:`1.5px solid ${T.g200}`,borderRadius:10,padding:"11px 14px",fontSize:14,color:"#0F172A",background:"#FFFFFF",boxSizing:"border-box"};

// ── JOIN FLOW (invite link) ──────────────────────────────────────────────────
function JoinFlow({go}) {
  const MEMBERS = MEMBERS_DEFAULT; // for household preview in join flow
  const [phase, setPhase] = useState("code"); // code | details | pin | success
  const [code, setCode]   = useState("");
  const [name, setName]   = useState("");
  const [pin,  setPin]    = useState(["","","",""]);
  const [err,  setErr]    = useState("");
  const pinRefs = [useRef(null),useRef(null),useRef(null),useRef(null)];

  const VALID_CODE = "SUNSET-7F2K";

  function submitCode() {
    if (code.trim().toUpperCase() === VALID_CODE) { setErr(""); setPhase("details"); }
    else setErr("Invalid invite code. Please check the link or code and try again.");
  }

  function submitDetails() {
    if (!name.trim()) { setErr("Please enter your name."); return; }
    setErr(""); setPhase("pin");
    setTimeout(() => pinRefs[0].current && pinRefs[0].current.focus(), 100);
  }

  function handlePin(i, val) {
    if (!/^\d?$/.test(val)) return;
    const next = [...pin]; next[i] = val; setPin(next);
    if (val && i < 3) pinRefs[i+1].current && pinRefs[i+1].current.focus();
  }

  function handlePinKey(i, e) {
    if (e.key === "Backspace" && !pin[i] && i > 0) pinRefs[i-1].current && pinRefs[i-1].current.focus();
  }

  function submitPin() {
    if (pin.join("").length < 4) { setErr("Please enter all 4 digits."); return; }
    setErr(""); setPhase("success");
  }

  if (phase === "code") return (
    <div style={{padding:"40px 24px 32px",minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      <button onClick={()=>go("onboarding")} style={{background:"none",border:"none",color:T.g400,display:"flex",alignItems:"center",gap:6,fontSize:13,fontWeight:500,marginBottom:28,alignSelf:"flex-start"}}>
        {Icon.arrowL}<span>Back</span>
      </button>
      <div style={{width:48,height:48,borderRadius:14,background:T.teal10,border:`1px solid ${T.teal20}`,display:"flex",alignItems:"center",justifyContent:"center",color:T.teal,marginBottom:16}}>
        {Icon.link}
      </div>
      <div style={{fontSize:24,fontWeight:800,color:T.g900,marginBottom:6}}>Join a household</div>
      <div style={{fontSize:14,color:T.g500,marginBottom:32,lineHeight:1.6}}>Enter the invite code from the link your housemate shared with you.</div>

      <label style={{fontSize:12,fontWeight:600,color:T.g500,display:"block",marginBottom:6}}>Invite code</label>
      <input
        value={code} onChange={e => setCode(e.target.value.toUpperCase())}
        onKeyDown={e => e.key === "Enter" && submitCode()}
        placeholder="e.g. SUNSET-7F2K"
        style={{...inp, fontFamily:"monospace", fontSize:16, letterSpacing:2, textTransform:"uppercase", borderColor: err ? T.red : T.g200, marginBottom:8}}
      />
      {err && (
        <div style={{display:"flex",alignItems:"center",gap:6,color:T.red,fontSize:12,fontWeight:500,marginBottom:12}}>
          <span style={{color:T.red,flexShrink:0}}>{Icon.warn}</span>{err}
        </div>
      )}
      <div style={{fontSize:12,color:T.g400,marginBottom:28,lineHeight:1.5}}>
        The invite code is included in the link your housemate sent you — it's the part after the last slash. For this demo, enter: <strong style={{color:T.teal,fontFamily:"monospace"}}>SUNSET-7F2K</strong>
      </div>
      <button onClick={submitCode} style={{width:"100%",background:T.teal,border:"none",borderRadius:12,padding:"14px",color:T.white,fontSize:15,fontWeight:700}}>
        Verify Code
      </button>
    </div>
  );

  if (phase === "details") return (
    <div style={{padding:"40px 24px 32px",minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      <button onClick={()=>setPhase("code")} style={{background:"none",border:"none",color:T.g400,display:"flex",alignItems:"center",gap:6,fontSize:13,fontWeight:500,marginBottom:28,alignSelf:"flex-start"}}>
        {Icon.arrowL}<span>Back</span>
      </button>

      {/* Household preview */}
      <div style={{background:T.teal10,border:`1px solid ${T.teal20}`,borderRadius:14,padding:"14px 16px",marginBottom:28}}>
        <div style={{fontSize:11,fontWeight:600,color:T.g400,marginBottom:4}}>You're joining</div>
        <div style={{fontSize:17,fontWeight:700,color:T.g900}}>Sunset Ave</div>
        <div style={{fontSize:13,color:T.g500,marginTop:2}}>Vancouver · 2 members already joined</div>
        <div style={{display:"flex",gap:6,marginTop:10}}>
          {MEMBERS.slice(0,2).map(m=><Av key={m.id} m={m} size={28}/>)}
          <div style={{width:28,height:28,borderRadius:"50%",background:T.g100,border:`2px solid ${T.g200}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:T.g400,fontWeight:600}}>+1</div>
        </div>
      </div>

      <div style={{fontSize:24,fontWeight:800,color:T.g900,marginBottom:6}}>Tell us your name</div>
      <div style={{fontSize:14,color:T.g500,marginBottom:24,lineHeight:1.6}}>This is how your housemates will see you in the app.</div>

      <label style={{fontSize:12,fontWeight:600,color:T.g500,display:"block",marginBottom:6}}>Your first name</label>
      <input
        value={name} onChange={e=>setName(e.target.value)}
        onKeyDown={e => e.key==="Enter" && submitDetails()}
        placeholder="First name"
        style={{...inp, borderColor: err ? T.red : T.g200, marginBottom: err ? 8 : 24}}
      />
      {err && <div style={{display:"flex",alignItems:"center",gap:6,color:T.red,fontSize:12,fontWeight:500,marginBottom:16}}><span style={{color:T.red,flexShrink:0}}>{Icon.warn}</span>{err}</div>}

      <button onClick={submitDetails} style={{width:"100%",background:T.teal,border:"none",borderRadius:12,padding:"14px",color:T.white,fontSize:15,fontWeight:700}}>
        Continue
      </button>
      <div style={{fontSize:11,color:T.g400,textAlign:"center",marginTop:14,lineHeight:1.5}}>
        No email verification required at join. Your details are only visible to your housemates.
      </div>
    </div>
  );

  if (phase === "pin") return (
    <div style={{padding:"40px 24px 32px",minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      <button onClick={()=>setPhase("details")} style={{background:"none",border:"none",color:T.g400,display:"flex",alignItems:"center",gap:6,fontSize:13,fontWeight:500,marginBottom:28,alignSelf:"flex-start"}}>
        {Icon.arrowL}<span>Back</span>
      </button>
      <div style={{width:48,height:48,borderRadius:14,background:T.teal10,border:`1px solid ${T.teal20}`,display:"flex",alignItems:"center",justifyContent:"center",color:T.teal,marginBottom:16}}>
        {Icon.lock}
      </div>
      <div style={{fontSize:24,fontWeight:800,color:T.g900,marginBottom:6}}>Create your PIN</div>
      <div style={{fontSize:14,color:T.g500,marginBottom:32,lineHeight:1.6}}>
        Choose a 4-digit PIN, <strong>{name}</strong>. You'll use this to access your household.
      </div>

      <div style={{display:"flex",gap:12,justifyContent:"center",marginBottom:8}}>
        {pin.map((digit,i) => (
          <input
            key={i} ref={pinRefs[i]}
            type="text" inputMode="numeric" maxLength={1}
            value={digit} onChange={e => handlePin(i, e.target.value)}
            onKeyDown={e => handlePinKey(i, e)}
            style={{
              width:60,height:68,textAlign:"center",fontSize:28,fontWeight:700,
              border:`2px solid ${digit ? T.teal : err ? T.red : T.g200}`,
              borderRadius:14,background:digit ? T.teal10 : T.white,
              color:T.g900,boxSizing:"border-box",
            }}
          />
        ))}
      </div>
      {err && <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,color:T.red,fontSize:12,fontWeight:500,marginBottom:8}}><span style={{color:T.red,flexShrink:0}}>{Icon.warn}</span>{err}</div>}
      <div style={{fontSize:12,color:T.g400,textAlign:"center",marginBottom:28}}>This PIN keeps your account secure.</div>

      <button onClick={submitPin} style={{width:"100%",background:T.teal,border:"none",borderRadius:12,padding:"14px",color:T.white,fontSize:15,fontWeight:700}}>
        Join Household
      </button>
    </div>
  );

  // Success
  return (
    <div style={{padding:"40px 24px 32px",minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center"}}>
      <div style={{width:72,height:72,borderRadius:"50%",background:T.teal10,border:`2px solid ${T.teal20}`,display:"flex",alignItems:"center",justifyContent:"center",color:T.teal,marginBottom:20}}>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div style={{fontSize:24,fontWeight:800,color:T.g900,marginBottom:6}}>You're in, {name}!</div>
      <div style={{fontSize:14,color:T.g500,marginBottom:32,lineHeight:1.6,maxWidth:280}}>
        You've joined <strong>Sunset Ave</strong>. Your housemates have been notified.
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10,width:"100%",marginBottom:28}}>
        {MEMBERS.map(m=>(
          <div key={m.id} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",background:T.teal10,border:`1px solid ${T.teal20}`,borderRadius:12}}>
            <Av m={m} size={36}/>
            <div style={{textAlign:"left"}}>
              <div style={{fontSize:13,fontWeight:600,color:T.g800}}>{m.name}</div>
              <div style={{fontSize:12,color:T.teal}}>Already joined</div>
            </div>
            <div style={{marginLeft:"auto",color:T.teal}}>{Icon.check}</div>
          </div>
        ))}
        <div style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",background:T.white,border:`1.5px solid ${T.teal}`,borderRadius:12}}>
          <div style={{width:36,height:36,borderRadius:"50%",background:T.teal10,border:`2px solid ${T.teal}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:T.teal,flexShrink:0}}>{name.slice(0,2).toUpperCase()}</div>
          <div style={{textAlign:"left"}}>
            <div style={{fontSize:13,fontWeight:700,color:T.g800}}>{name} (You)</div>
            <div style={{fontSize:12,color:T.teal}}>Just joined</div>
          </div>
          <div style={{marginLeft:"auto",color:T.teal}}>{Icon.check}</div>

      </div>
      <button onClick={()=>go(name)} style={{width:"100%",background:T.teal,border:"none",borderRadius:12,padding:"14px",color:T.white,fontSize:15,fontWeight:700}}>
        Go to Dashboard
      </button>
    </div>
  );
}

  const [step,          setStep]          = useState(0);
  const [initiatorName, setInitiatorName] = useState("Leticia");
  const [nm,            setNm]            = useState("Sunset Ave");
  const [ct,            setCt]            = useState("Vancouver");
  const [cnt,           setCnt]           = useState(3);
  const [joined,        setJoined]        = useState([1]);
  const [tab,           setTab]           = useState("link");
  const [copied,        setCopied]        = useState(false);
  const qrRef                             = useRef(null);
  // Build demo member list dynamically based on cnt and initiator name
  const demoMembers = buildMembers({name:initiatorName||"Leticia",initials:(initiatorName||"LE").slice(0,2).toUpperCase()}, cnt);
  const done        = joined.length === cnt;
  const INVITE_CODE = nm.trim().split(" ")[0].toUpperCase()+"-7F2K";
  const FULL_LINK   = `https://roomsync.app/join/${nm.toLowerCase().replace(/\s+/g,"-")}-7f2k`;

  useEffect(() => {
    if (step !== 2 || tab !== "qr" || !qrRef.current) return;
    qrRef.current.innerHTML = "";
    if (window.QRCode) new window.QRCode(qrRef.current, {text:FULL_LINK,width:200,height:200,colorDark:T.tealDk,colorLight:T.white,correctLevel:window.QRCode.CorrectLevel.M});
  }, [step, tab]);

  function copyLink() {
    const copy = () => { setCopied(true); setTimeout(()=>setCopied(false),2200); };
    if (navigator.clipboard) navigator.clipboard.writeText(FULL_LINK).then(copy);
    else { const ta=document.createElement("textarea");ta.value=FULL_LINK;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);copy(); }
  }
  function shareVia(ch) {
    const msg=`Join our RoomSync household "${nm}"! Use code ${INVITE_CODE} or tap: ${FULL_LINK}`;
    const urls={whatsapp:`https://wa.me/?text=${encodeURIComponent(msg)}`,sms:`sms:?body=${encodeURIComponent(msg)}`,email:`mailto:?subject=${encodeURIComponent("Join our RoomSync household")}&body=${encodeURIComponent(msg)}`};
    if(urls[ch]) window.open(urls[ch],"_blank");

    <div style={{padding:"40px 24px 32px",display:"flex",flexDirection:"column",alignItems:"center"}}>

      <div style={{width:"100%",display:"flex",flexDirection:"column",gap:8,marginBottom:28}}>

          {icon:"agreement", label:"Agreement Builder",   desc:"Co-sign house rules before move-in"},

          <div key={i} style={{display:"flex",alignItems:"center",gap:14,padding:"12px 16px",background:T.g50,borderRadius:12,border:`1px solid ${T.g100}`}}>

            <div>
              <div style={{fontSize:13,fontWeight:600,color:T.g800}}>{f.label}</div>

            </div>

      </div>
      <button onClick={()=>setStep(1)} style={{width:"100%",background:T.teal,border:"none",borderRadius:12,padding:"14px",color:T.white,fontSize:15,fontWeight:700,marginBottom:10}}>Create a household</button>
      <button onClick={()=>go("join")} style={{width:"100%",background:"none",border:`1.5px solid ${T.g200}`,borderRadius:12,padding:"13px",color:T.g600,fontSize:14,fontWeight:500}}>I have an invite link</button>

        </div>

          <div style={{background:T.g50,border:`1px solid ${T.g200}`,borderRadius:12,padding:"12px 16px",marginBottom:10}}>

function Agreement({members, agreeMapProp, setAgreeMapProp, customTopicsProp, setCustomTopicsProp}) {
  const MEMBERS = members || MEMBERS_DEFAULT;
  // answers:     { topicId: { memberId: string (single) | string[] (multi) } }
  // agreeMap:    { topicId: string | string[] }  — final agreed value
  // customTimes: { topicId: string }  — optional custom time string per topic
  // customTopics: [{ id, label, question }]  — user-added custom topics
  const [answers,      setAnswers]      = useState({});
  // agreeMap and customTopics are lifted to App so they persist across navigation
  const agreeMap      = agreeMapProp     || {};
  const setAgreeMap   = setAgreeMapProp  || (()=>{});
  const customTopics  = customTopicsProp  || [];
  const setCustomTopics = setCustomTopicsProp || (()=>{});
  const [customTimes,  setCustomTimes]  = useState({});
  const [phase,        setPhase]        = useState("overview");
  const [wizardIdx,    setWizardIdx]    = useState(0);
  const [conflictId,   setConflictId]   = useState(null);
  const [exported,     setExported]     = useState(false);
  const [showAddTopic, setShowAddTopic] = useState(false);
  const [newTopicLabel,setNewTopicLabel]= useState("");
  const [newTopicQ,    setNewTopicQ]    = useState("");
  const [customTimeInput, setCustomTimeInput] = useState("");
  const [showCustomTimeFor, setShowCustomTimeFor] = useState(null); // topicId

  const ME = MEMBERS[0];

  // All topics = built-in + custom
  const allTopics = [
    ...AGREEMENT_TOPICS_DEF,
    ...customTopics.map(t => ({...t, icon:"bill", options:[], multiSelect:false, isCustom:true})),
  ];

  // Compute status of each topic
  function topicStatus(id) {
    const topic = allTopics.find(t=>t.id===id);
    const ans = answers[id] || {};
    // Custom topics with no options are answered when agreeMap has a value
    if (topic?.isCustom) return agreeMap[id] ? "agreed" : "pending";
    const answeredMembers = Object.keys(ans).length;
    if (answeredMembers < MEMBERS.length) return "pending";
    // Multi-select: compare as sorted JSON strings
    const vals = Object.values(ans).map(v => Array.isArray(v) ? JSON.stringify([...v].sort()) : v);
    if (vals.every(v => v === vals[0])) return "agreed";
    return "conflict";
  }

  const statuses = allTopics.reduce((acc, t) => ({...acc, [t.id]: topicStatus(t.id)}), {});
  const allResolved = allTopics.every(t => agreeMap[t.id]);
  const pendingCount = allTopics.filter(t => statuses[t.id]==="pending").length;
  const conflictCount = allTopics.filter(t => statuses[t.id]==="conflict" && !agreeMap[t.id]).length;
  const resolvedCount = allTopics.filter(t => agreeMap[t.id]).length;
  const progress = allTopics.length ? Math.round((resolvedCount / allTopics.length)*100) : 0;

  // ── WIZARD: member answers one topic ──────────────────────────────────────
  if (phase === "wizard") {
    const topic = allTopics[wizardIdx];
    if (!topic) { setPhase("review"); return null; }
    const totalTopics = allTopics.length;
    const myAnswer = (answers[topic.id]||{})[ME.id]; // string or string[]

    // Multi-select toggle
    function toggleMulti(opt) {
      const prev = Array.isArray(myAnswer) ? myAnswer : [];
      const next = prev.includes(opt) ? prev.filter(x=>x!==opt) : [...prev, opt];
      setAnswers(a=>({...a,[topic.id]:{...(a[topic.id]||{}),[ME.id]:next}}));
    }

    // Confirm multi-select and proceed
    function confirmMulti() {
      const my = Array.isArray(myAnswer) ? myAnswer : [];
      if (my.length === 0) return;
      // Demo: other members pick same selection (no conflict for multi)
      const fullAnswers = {...answers, [topic.id]:{1:my,2:my,3:my}};
      setAnswers(fullAnswers);
      setAgreeMap(a=>({...a,[topic.id]:my}));
      const nextIdx = allTopics.findIndex((t,i)=>i>wizardIdx&&!agreeMap[t.id]);
      if(nextIdx===-1) setPhase("review"); else setWizardIdx(nextIdx);
    }

    // Single-select with optional custom time
    function selectOption(opt) {
      if (topic.allowCustomTime) {
        setShowCustomTimeFor(topic.id);
        setCustomTimeInput("");
        // Temporarily set answer and proceed after time choice
        const fullAnswers = {...answers};
        const demoMap = {
          quiet:      {1:opt,2:"10pm – 8am",3:"11pm – 8am"},
          dishes:     {1:opt,2:"Within 24 hours",3:"Within 48 hours"},
          guests:     {1:opt,2:"24 hours notice required",3:opt},
          guestmax:   {1:opt,2:opt,3:opt},
          noise:      {1:opt,2:opt,3:"No rule"},
          bills:      {1:opt,2:"Within 48 hours of being asked",3:opt},
          thermostat: {1:opt,2:opt,3:"Discuss and agree when needed"},
          chores_miss:{1:opt,2:opt,3:opt},
          clean:      {1:opt,2:opt,3:"Once a week"},
        };
        fullAnswers[topic.id] = demoMap[topic.id]||{1:opt,2:opt,3:opt};
        fullAnswers[topic.id][ME.id] = opt;
        setAnswers(fullAnswers);
        return; // Wait for custom time modal
      }
      proceedSingle(opt);
    }

    function proceedSingle(opt) {
      const demoMap = {
        quiet:      {1:opt,2:"10pm – 8am",3:"11pm – 8am"},
        dishes:     {1:opt,2:"Within 24 hours",3:"Within 48 hours"},
        guests:     {1:opt,2:"24 hours notice required",3:opt},
        guestmax:   {1:opt,2:opt,3:opt},
        noise:      {1:opt,2:opt,3:"No rule"},
        bills:      {1:opt,2:"Within 48 hours of being asked",3:opt},
        thermostat: {1:opt,2:opt,3:"Discuss and agree when needed"},
        chores_miss:{1:opt,2:opt,3:opt},
        clean:      {1:opt,2:opt,3:"Once a week"},
      };
      const fullAnswers = {...answers};
      fullAnswers[topic.id] = demoMap[topic.id]||{1:opt,2:opt,3:opt};
      fullAnswers[topic.id][ME.id] = opt;
      setAnswers(fullAnswers);
      const vals = Object.values(fullAnswers[topic.id]);
      const isConflict = !vals.every(v=>v===vals[0]);
      if(isConflict){setConflictId(topic.id);setPhase("conflict");}
      else{
        setAgreeMap(a=>({...a,[topic.id]:fullAnswers[topic.id][ME.id]}));
        const nextIdx=allTopics.findIndex((t,i)=>i>wizardIdx&&!agreeMap[t.id]);
        if(nextIdx===-1)setPhase("review");else setWizardIdx(nextIdx);
      }
    }

    // Custom topic (no options): free-text input
    if (topic.isCustom) {
      const customVal = agreeMap[topic.id] || "";
      return (
        <div style={{background:T.g50,minHeight:"100vh",paddingBottom:80}}>
          <TopBar title={`${wizardIdx+1} of ${totalTopics}`} sub={topic.label}
            back={()=>{if(wizardIdx>0)setWizardIdx(i=>i-1);else setPhase("overview");}}
            right={<button onClick={()=>setPhase("overview")} style={{background:"none",border:"none",color:T.g400,fontSize:13,fontWeight:500}}>Save & Exit</button>}/>
          <div style={{padding:"10px 16px 0"}}><Bar pct={(wizardIdx/totalTopics)*100} color={T.teal} h={4}/></div>
          <div style={{padding:"16px 16px 0"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16,padding:"10px 14px",background:T.teal10,border:`1px solid ${T.teal20}`,borderRadius:12}}>
              <Av m={ME} size={28}/><div><div style={{fontSize:12,fontWeight:700,color:T.tealDk}}>Answering as {ME.name}</div><div style={{fontSize:11,color:T.g500}}>Custom topic</div></div>
            </div>
            <div style={{fontSize:18,fontWeight:800,color:T.g900,marginBottom:6,lineHeight:1.35}}>{topic.question||topic.label}</div>
            <div style={{fontSize:13,color:T.g500,marginBottom:20}}>Type the agreed rule or decision for this topic.</div>
            <textarea
              placeholder="e.g. All household members agree to..."
              defaultValue={customVal}
              id="custom-topic-input"
              style={{...inp,height:100,resize:"none",fontFamily:"inherit",lineHeight:1.6,marginBottom:16}}
            />
            <button onClick={()=>{
              const val=document.getElementById("custom-topic-input").value.trim();
              if(!val)return;
              setAgreeMap(a=>({...a,[topic.id]:val}));
              const nextIdx=allTopics.findIndex((t,i)=>i>wizardIdx&&!agreeMap[t.id]);
              if(nextIdx===-1)setPhase("review");else setWizardIdx(nextIdx);
            }} style={{width:"100%",background:T.teal,border:"none",borderRadius:12,padding:"14px",color:T.white,fontSize:15,fontWeight:700}}>Save & Continue</button>
          </div>
        </div>
      );
    }

    // Custom time overlay
    if (showCustomTimeFor === topic.id) {
      const currentOpt = (answers[topic.id]||{})[ME.id];
      return (
        <div style={{background:T.g50,minHeight:"100vh",paddingBottom:80}}>
          <TopBar title="Set Custom Time" sub={topic.label} back={()=>setShowCustomTimeFor(null)}/>
          <div style={{padding:"16px 16px 0"}}>
            <div style={{background:T.teal10,border:`1px solid ${T.teal20}`,borderRadius:12,padding:"12px 16px",marginBottom:20}}>
              <div style={{fontSize:12,color:T.g500,marginBottom:2}}>Selected option</div>
              <div style={{fontSize:14,fontWeight:700,color:T.tealDk}}>{currentOpt}</div>
            </div>
            <div style={{fontSize:14,fontWeight:700,color:T.g800,marginBottom:6}}>Add a custom time (optional)</div>
            <div style={{fontSize:13,color:T.g500,marginBottom:14,lineHeight:1.5}}>
              If none of the preset times work, specify an exact time or period. Leave blank to use the selected option as-is.
            </div>
            <input
              value={customTimeInput}
              onChange={e=>setCustomTimeInput(e.target.value)}
              placeholder="e.g. 10:30pm – 7:30am, or Within 6 hours"
              style={{...inp,marginBottom:16,fontSize:15}}
            />
            <button onClick={()=>{
              const finalVal = customTimeInput.trim() ? customTimeInput.trim() : currentOpt;
              if(customTimeInput.trim()) setCustomTimes(ct=>({...ct,[topic.id]:finalVal}));
              setShowCustomTimeFor(null);
              proceedSingle(finalVal);
            }} style={{width:"100%",background:T.teal,border:"none",borderRadius:12,padding:"14px",color:T.white,fontSize:15,fontWeight:700,marginBottom:10}}>
              {customTimeInput.trim() ? "Use custom time & continue" : "Use selected option & continue"}
            </button>
            <button onClick={()=>{setShowCustomTimeFor(null); proceedSingle(currentOpt);}} style={{width:"100%",background:T.white,border:`1.5px solid ${T.g200}`,borderRadius:12,padding:"13px",color:T.g500,fontSize:14}}>
              Skip — use selected option
            </button>
          </div>
        </div>
      );
    }

    const myMulti = Array.isArray(myAnswer) ? myAnswer : [];

    return (
      <div style={{background:T.g50,minHeight:"100vh",paddingBottom:topic.multiSelect?120:80}}>
        <TopBar
          title={`${wizardIdx+1} of ${totalTopics}`}
          sub={topic.label}
          back={()=>{ if(wizardIdx>0) setWizardIdx(i=>i-1); else setPhase("overview"); }}
          right={<button onClick={()=>setPhase("overview")} style={{background:"none",border:"none",color:T.g400,fontSize:13,fontWeight:500}}>Save & Exit</button>}
        />
        <div style={{padding:"10px 16px 0"}}>
          <Bar pct={(wizardIdx/totalTopics)*100} color={T.teal} h={4}/>
        </div>
        <div style={{padding:"16px 16px 0"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16,padding:"10px 14px",background:T.teal10,border:`1px solid ${T.teal20}`,borderRadius:12}}>
            <Av m={ME} size={28}/>
            <div>
              <div style={{fontSize:12,fontWeight:700,color:T.tealDk}}>Answering as {ME.name}</div>
              <div style={{fontSize:11,color:T.g500}}>{topic.multiSelect?"Select all that apply":"Each member answers on their own device"}</div>
            </div>
          </div>
          <div style={{fontSize:18,fontWeight:800,color:T.g900,marginBottom:6,lineHeight:1.35}}>{topic.question}</div>
          <div style={{fontSize:13,color:T.g500,marginBottom:topic.allowCustomTime?6:20,lineHeight:1.6}}>{topic.sub}</div>
          {topic.allowCustomTime&&(
            <div style={{fontSize:12,color:T.teal,fontWeight:600,marginBottom:16,display:"flex",alignItems:"center",gap:6}}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              You can set a custom time after selecting any option
            </div>
          )}
          <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:topic.multiSelect?80:0}}>
            {topic.options.map(opt => {
              const selected = topic.multiSelect ? myMulti.includes(opt) : myAnswer === opt;
              return (
                <button key={opt} onClick={()=>topic.multiSelect?toggleMulti(opt):selectOption(opt)} style={{
                  background: selected ? T.teal : T.white,
                  border: `1.5px solid ${selected ? T.teal : T.g200}`,
                  borderRadius: 12, padding: "13px 16px",
                  textAlign: "left", display: "flex", alignItems: "center", gap: 12,
                  boxShadow: "0 1px 3px rgba(0,0,0,0.05)",
                }}>
                  <div style={{
                    width: 20, height: 20, borderRadius: topic.multiSelect?"4px":"50%", flexShrink: 0,
                    background: selected ? T.white : T.white,
                    border: `2px solid ${selected ? T.white : T.g300}`,
                    display: "flex", alignItems: "center", justifyContent: "center",
                  }}>
                    {selected && (topic.multiSelect
                      ? <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={T.teal} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                      : <div style={{width:10,height:10,borderRadius:"50%",background:T.teal}}/>
                    )}
                  </div>
                  <span style={{fontSize:14,fontWeight:selected?700:400,color:selected?T.white:T.g700,flex:1}}>{opt}</span>
                </button>
              );
            })}
          </div>
        </div>
        {topic.multiSelect&&(
          <div style={{position:"fixed",bottom:56,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,padding:"12px 16px",background:T.white,borderTop:`1px solid ${T.g100}`,zIndex:50}}>
            <div style={{fontSize:12,color:T.g400,marginBottom:8}}>{myMulti.length} option{myMulti.length!==1?"s":""} selected</div>
            <button onClick={confirmMulti} disabled={myMulti.length===0} style={{width:"100%",background:myMulti.length>0?T.teal:T.g300,border:"none",borderRadius:12,padding:"13px",color:T.white,fontSize:15,fontWeight:700}}>
              Confirm & Continue
            </button>
          </div>
        )}
      </div>
    );
  }

  // ── CONFLICT RESOLUTION ───────────────────────────────────────────────────
  if (phase === "conflict" && conflictId) {
    const topic = allTopics.find(t=>t.id===conflictId);
    const topicAnswers = answers[conflictId]||{};
    const vals = Object.values(topicAnswers);
    const freq = vals.reduce((acc,v)=>({...acc,[v]:(acc[v]||0)+1}),{});
    const majorityVal = Object.entries(freq).sort((a,b)=>b[1]-a[1])[0]?.[0];
    const allOpts = topic.options||[];
    const uniqueVals = [...new Set(vals)];
    const indices = uniqueVals.map(v=>allOpts.indexOf(v)).filter(i=>i>=0);
    const midIdx = indices.length>=2 ? Math.round((Math.min(...indices)+Math.max(...indices))/2) : -1;
    const compromiseVal = midIdx>=0 ? allOpts[midIdx] : majorityVal;

    const resOptions = [
      { label:"Compromise", sub:"Pick the middle-ground option", val:compromiseVal, star:true },
      { label:"Majority rules", sub:"Go with the most popular answer", val:majorityVal, star:false },
      { label:"Most lenient", sub:"Use the least restrictive answer", val:allOpts.length?allOpts[Math.max(...indices)]:majorityVal, star:false },
      { label:"Most strict", sub:"Use the most restrictive answer", val:allOpts.length?allOpts[Math.min(...indices)]:majorityVal, star:false },
      { label:"Revisit in 30 days", sub:"Defer this decision — flag for later", val:"Revisit in 30 days", star:false },
    ].filter((o,i,arr)=>arr.findIndex(x=>x.val===o.val)===i);

    function resolveConflict(val) {
      setAgreeMap(a=>({...a,[conflictId]:val}));
      setConflictId(null);
      const nextIdx = allTopics.findIndex((t,i)=>i>wizardIdx && !agreeMap[t.id] && t.id!==conflictId);
      if (nextIdx===-1) { setPhase("review"); }
      else { setWizardIdx(nextIdx); setPhase("wizard"); }
    }

    return (
      <div style={{background:T.g50,minHeight:"100vh",paddingBottom:80}}>
        <TopBar title="Conflict Detected" sub={topic.label} back={()=>{setPhase("wizard");}}/>
        <div style={{padding:"14px 16px"}}>

          {/* Conflict banner */}
          <div style={{background:T.amber10,border:`1.5px solid ${T.amber}44`,borderRadius:14,padding:16,marginBottom:16}}>
            <div style={{display:"flex",alignItems:"center",gap:6,fontSize:13,fontWeight:700,color:T.amber,marginBottom:12}}>
              {Icon.warn} Members gave different answers
            </div>
            {MEMBERS.map(m=>{
              const ans = topicAnswers[m.id];
              if(!ans) return null;
              const isUnique = vals.filter(v=>v===ans).length===1;
              return (
                <div key={m.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8,padding:"8px 10px",background:T.white,borderRadius:10,border:`1px solid ${T.g200}`}}>
                  <Av m={m} size={28}/>
                  <div style={{flex:1}}>
                    <div style={{fontSize:12,fontWeight:600,color:T.g700}}>{m.name}</div>
                    <div style={{fontSize:12,color:T.g500,marginTop:1}}>{ans}</div>
                  </div>
                  {isUnique&&<Pill label="Disagrees" color={T.red}/>}
                </div>
              );
            })}
          </div>

          <div style={{fontSize:13,fontWeight:700,color:T.g700,marginBottom:4}}>Resolve this disagreement</div>
          <div style={{fontSize:12,color:T.g400,marginBottom:14,lineHeight:1.5}}>All members must agree on one answer before the agreement is finalised. Choose how to proceed.</div>

          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {resOptions.map(opt=>(
              <button key={opt.val} onClick={()=>resolveConflict(opt.val)} style={{
                background:opt.star?T.teal10:T.white,
                border:`1.5px solid ${opt.star?T.teal:T.g200}`,
                borderRadius:14,padding:"13px 16px",textAlign:"left",
              }}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                  <div style={{fontSize:14,fontWeight:700,color:opt.star?T.teal:T.g800}}>{opt.label}</div>
                  {opt.star&&<Pill label="Recommended" color={T.teal}/>}
                </div>
                <div style={{fontSize:12,color:T.g400,marginBottom:4}}>{opt.sub}</div>
                <div style={{fontSize:13,fontWeight:600,color:opt.star?T.teal:T.g600,padding:"6px 10px",background:opt.star?T.teal20:T.g50,borderRadius:8,display:"inline-block"}}>"{opt.val}"</div>
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // ── REVIEW / COMPLETE ─────────────────────────────────────────────────────
  if (phase === "review" || phase === "complete") {
    const unresolvedConflicts = allTopics.filter(t => statuses[t.id]==="conflict" && !agreeMap[t.id]);
    const pendingTopics = allTopics.filter(t => statuses[t.id]==="pending" && !agreeMap[t.id]);
    const canSign = unresolvedConflicts.length===0 && pendingTopics.length===0;

    // Helper: format agreed value (could be array for multiSelect)
    function fmtVal(v) {
      if (!v) return "Not agreed";
      if (Array.isArray(v)) return v.join("; ");
      return v;
    }

    // Build the PDF/print HTML — open in new tab then print
    function openPDF() {
      const date = new Date().toLocaleDateString("en-CA",{year:"numeric",month:"long",day:"numeric"});
      const rows = allTopics.map(t=>{
        const val = fmtVal(agreeMap[t.id]);
        const isCustom = t.isCustom ? " <em style='font-size:10px;color:#94A3B8'>(custom)</em>" : "";
        const ct = customTimes[t.id] ? ` <span style='color:#D4522A;font-size:11px'>(custom time: ${customTimes[t.id]})</span>` : "";
        return `<tr>
          <td style="padding:10px 14px;border-bottom:1px solid #F1F5F9;font-weight:600;color:#334155;width:35%">${t.label}${isCustom}</td>
          <td style="padding:10px 14px;border-bottom:1px solid #F1F5F9;color:#475569">${val}${ct}</td>
        </tr>`;
      }).join("");
      const sigs = MEMBERS.map(m=>`
        <div style="flex:1;border-top:2px solid #CBD5E1;padding-top:10px">
          <div style="font-size:14px;font-weight:600;color:#334155">${m.name}</div>
          <div style="font-size:11px;color:#94A3B8;margin-top:4px">${m.role}</div>
          <div style="font-size:11px;color:#D4522A;margin-top:6px">Co-signed digitally via RoomSync</div>
        </div>`).join("");
      const html = `<!DOCTYPE html><html><head>
        <title>Sunset Ave — Household Agreement</title>
        <meta charset="UTF-8">
        <style>
          @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
          *{box-sizing:border-box;margin:0;padding:0}
          body{font-family:Inter,sans-serif;color:#1E293B;background:#fff;padding:0}
          .page{max-width:720px;margin:0 auto;padding:48px 40px}
          .header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:32px;padding-bottom:24px;border-bottom:2px solid #D4522A}
          .logo{font-size:22px;font-weight:800;color:#D4522A;letter-spacing:-0.5px}
          .meta{font-size:12px;color:#94A3B8;text-align:right;line-height:1.7}
          h1{font-size:28px;font-weight:800;color:#0F172A;margin-bottom:4px;letter-spacing:-0.5px}
          .subtitle{font-size:14px;color:#64748B;margin-bottom:32px}
          table{width:100%;border-collapse:collapse;margin-bottom:40px;border:1px solid #E2E8F0;border-radius:10px;overflow:hidden}
          thead tr{background:#F0FDFA}
          th{padding:11px 14px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#D4522A;font-weight:700;text-align:left}
          tr:last-child td{border-bottom:none}
          .sigs{display:flex;gap:20px;margin-top:40px;padding-top:32px;border-top:1px solid #E2E8F0}
          .footer{margin-top:32px;font-size:11px;color:#94A3B8;text-align:center;border-top:1px solid #F1F5F9;padding-top:16px}
          @media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
        </style>
      </head><body>
        <div class="page">
          <div class="header">
            <div>
              <div class="logo">RoomSync</div>
              <div style="font-size:12px;color:#94A3B8;margin-top:2px">Conflict-free shared living — by design.</div>
            </div>
            <div class="meta">
              <div><strong>Sunset Ave</strong> · Vancouver, BC</div>
              <div>${MEMBERS.map(m=>m.short).join(", ")}</div>
              <div>${date}</div>
            </div>
          </div>
          <h1>Household Agreement</h1>
          <div class="subtitle">This document records the agreed rules and expectations for Sunset Ave. All ${MEMBERS.length} members have co-signed.</div>
          <table>
            <thead><tr><th>Topic</th><th>Agreed Term</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="sigs">${sigs}</div>
          <div class="footer">
            Generated by RoomSync on ${date} &nbsp;·&nbsp;
            This is a shared household agreement between roommates. It is not a legally binding contract.
          </div>
        </div>
        <script>window.onload=function(){window.print();}<\/script>
      </body></html>`;
      const w = window.open("","_blank");
      if(w){ w.document.write(html); w.document.close(); }
      setExported(true);
    }

    return (
      <div style={{background:T.g50,minHeight:"100vh",paddingBottom:80}}>
        <TopBar title={canSign?"Agreement Complete":"Review Agreement"} sub={canSign?"Ready to export":"Finish resolving items"}
          right={pendingTopics.length>0||unresolvedConflicts.length>0
            ? <button onClick={()=>{
                const idx=allTopics.findIndex(t=>statuses[t.id]==="pending"||(!agreeMap[t.id]&&statuses[t.id]==="conflict"));
                setWizardIdx(idx>=0?idx:0);setPhase("wizard");
              }} style={{background:T.teal,border:"none",borderRadius:20,padding:"7px 14px",color:T.white,fontSize:12,fontWeight:700}}>Continue</button>
            : null}/>

        <div style={{padding:"12px 16px"}}>
          <Card style={{padding:16,marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <span style={{fontSize:14,fontWeight:700,color:T.g700}}>Progress</span>
              <span style={{fontSize:14,fontWeight:800,color:T.teal}}>{resolvedCount}/{allTopics.length}</span>
            </div>
            <Bar pct={progress} color={T.teal} h={6}/>
            <div style={{display:"flex",gap:10,marginTop:12}}>
              {[{label:"Agreed",count:resolvedCount,color:T.teal},{label:"Conflicts",count:unresolvedConflicts.length,color:T.amber},{label:"Pending",count:pendingTopics.length,color:T.g300}].map(s=>(
                <div key={s.label} style={{flex:1,textAlign:"center",padding:"8px 4px",background:T.g50,borderRadius:8}}>
                  <div style={{fontSize:18,fontWeight:800,color:s.color}}>{s.count}</div>
                  <div style={{fontSize:10,color:T.g400,marginTop:1}}>{s.label}</div>
                </div>
              ))}
            </div>
          </Card>

          {unresolvedConflicts.length>0&&<>
            <div style={{fontSize:11,fontWeight:700,color:T.red,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Conflicts to resolve ({unresolvedConflicts.length})</div>
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
              {unresolvedConflicts.map(t=>(
                <Card key={t.id} style={{border:`1.5px solid ${T.amber}55`}}>
                  <div style={{padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
                    <div style={{width:36,height:36,borderRadius:10,background:T.amber10,display:"flex",alignItems:"center",justifyContent:"center",color:T.amber,flexShrink:0}}>{Icon.warn}</div>
                    <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:T.g800}}>{t.label}</div><div style={{fontSize:12,color:T.amber,marginTop:2}}>Members disagree — needs resolution</div></div>
                    <button onClick={()=>{setConflictId(t.id);setPhase("conflict");}} style={{background:T.amber,border:"none",borderRadius:8,padding:"7px 13px",color:T.white,fontSize:12,fontWeight:700}}>Resolve</button>
                  </div>
                </Card>
              ))}
            </div>
          </>}

          {pendingTopics.length>0&&<>
            <div style={{fontSize:11,fontWeight:700,color:T.g400,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Not yet answered ({pendingTopics.length})</div>
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
              {pendingTopics.map(t=>(
                <Card key={t.id} style={{border:`1px solid ${T.g200}`}}>
                  <div style={{padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
                    <div style={{width:36,height:36,borderRadius:10,background:T.g100,display:"flex",alignItems:"center",justifyContent:"center",color:T.g400,flexShrink:0}}><TopicIcon id={t.icon} size={18}/></div>
                    <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:T.g700}}>{t.label}</div><div style={{fontSize:12,color:T.g400,marginTop:1}}>Not yet answered</div></div>
                    <button onClick={()=>{setWizardIdx(allTopics.indexOf(t));setPhase("wizard");}} style={{background:T.teal,border:"none",borderRadius:8,padding:"7px 13px",color:T.white,fontSize:12,fontWeight:700}}>Answer</button>
                  </div>
                </Card>
              ))}
            </div>
          </>}

          {resolvedCount>0&&<>
            <div style={{fontSize:11,fontWeight:700,color:T.g400,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Agreed ({resolvedCount})</div>
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
              {allTopics.filter(t=>agreeMap[t.id]).map(t=>{
                const val = agreeMap[t.id];
                const displayVal = Array.isArray(val) ? val : [val];
                return (
                  <Card key={t.id}>
                    <div style={{padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
                      <div style={{width:36,height:36,borderRadius:10,background:T.teal10,display:"flex",alignItems:"center",justifyContent:"center",color:T.teal,flexShrink:0}}><TopicIcon id={t.icon} size={18}/></div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:13,fontWeight:700,color:T.g800}}>{t.label}{t.isCustom&&<span style={{fontSize:10,color:T.purple,fontWeight:600,marginLeft:6,background:T.purple10,padding:"1px 6px",borderRadius:10}}>Custom</span>}</div>
                        {displayVal.map((v,i)=><div key={i} style={{fontSize:12,color:T.teal,marginTop:2,fontWeight:500}}>{v}</div>)}
                        {customTimes[t.id]&&<div style={{fontSize:11,color:T.g500,marginTop:2}}>Custom time: {customTimes[t.id]}</div>}
                      </div>
                      <span style={{color:T.mint}}>{Icon.check}</span>
                    </div>
                    <div style={{padding:"0 16px 10px",display:"flex",alignItems:"center",gap:6,borderTop:`1px solid ${T.g50}`}}>
                      <span style={{fontSize:11,color:T.g400,marginRight:4}}>Co-signed by</span>
                      {MEMBERS.map(m=><Av key={m.id} m={m} size={18}/>)}
                    </div>
                  </Card>
                );
              })}
            </div>
          </>}

          {canSign&&<>
            <div style={{background:T.teal10,border:`1px solid ${T.teal20}`,borderRadius:14,padding:16,marginBottom:16}}>
              <div style={{fontSize:14,fontWeight:700,color:T.tealDk,marginBottom:4}}>All topics agreed — ready to export</div>
              <div style={{fontSize:12,color:T.g500,lineHeight:1.6}}>Export or print a clean PDF copy for your records. Opens in a new tab — use your browser's print / save as PDF option.</div>
            </div>
            <button onClick={openPDF} style={{width:"100%",background:T.teal,border:"none",borderRadius:12,padding:"14px",color:T.white,fontSize:15,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",gap:10,marginBottom:10}}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              Export as PDF
            </button>
            {exported&&<div style={{textAlign:"center",color:T.mint,fontSize:13,fontWeight:600,marginTop:8}}>Opened in new tab — use Print → Save as PDF</div>}
          </>}
        </div>
      </div>
    );
  }

  // ── OVERVIEW ──────────────────────────────────────────────────────────────
  const hasStarted = Object.keys(answers).length > 0 || Object.keys(agreeMap).length > 0;

  return (
    <div style={{background:T.g50,minHeight:"100vh",paddingBottom:80}}>
      <TopBar title="Agreement Builder" sub="Sunset Ave House Rules"/>
      <div style={{padding:"12px 16px"}}>

        {/* Progress card */}
        <Card style={{padding:16,marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <span style={{fontSize:14,fontWeight:700,color:T.g700}}>{hasStarted?"Progress":"Not started"}</span>
            <span style={{fontSize:14,fontWeight:800,color:T.teal}}>{resolvedCount}/{allTopics.length} topics</span>
          </div>
          <Bar pct={progress} color={T.teal} h={6}/>
          {hasStarted&&(
            <div style={{display:"flex",gap:10,marginTop:12}}>
              {[{l:"Agreed",v:resolvedCount,color:T.teal},{l:"Conflict",v:conflictCount,color:T.amber},{l:"Pending",v:pendingCount,color:T.g300}].map(s=>(
                <div key={s.l} style={{flex:1,textAlign:"center",padding:"7px 4px",background:T.g50,borderRadius:8}}>
                  <div style={{fontSize:18,fontWeight:800,color:s.color}}>{s.v}</div>
                  <div style={{fontSize:10,color:T.g400,marginTop:1}}>{s.l}</div>
                </div>
              ))}
            </div>
          )}
          {allResolved&&(
            <div style={{display:"flex",alignItems:"center",gap:8,marginTop:12,padding:"10px 12px",background:T.teal10,borderRadius:10}}>
              <span style={{color:T.teal}}>{Icon.check}</span>
              <span style={{fontSize:12,fontWeight:700,color:T.teal}}>Signed by all 3 members · April 2026</span>
            </div>
          )}
        </Card>

        {/* CTA */}
        {!allResolved&&(
          <button onClick={()=>{
            const firstConflict = allTopics.findIndex(t=>!agreeMap[t.id]&&statuses[t.id]==="conflict");
            const firstPending  = allTopics.findIndex(t=>!agreeMap[t.id]&&statuses[t.id]!=="conflict");
            if(firstConflict>=0&&firstPending===-1){setConflictId(allTopics[firstConflict].id);setPhase("conflict");}
            else{setWizardIdx(firstPending>=0?firstPending:0);setPhase("wizard");}
          }} style={{width:"100%",background:T.teal,border:"none",borderRadius:12,padding:"14px",color:T.white,fontSize:15,fontWeight:700,marginBottom:16,display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
            {Icon.arrowR}
            {hasStarted?(conflictCount>0?"Resolve conflicts":"Continue building"):"Start Agreement Builder"}
          </button>

        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>

            const s = statuses[t.id];

            const statusColor = agreed?T.teal:s==="conflict"?T.amber:T.g300;
            const statusLabel = agreed?"Agreed":s==="conflict"?"Conflict":"Pending";
            const displayVal = agreed ? (Array.isArray(agreed) ? agreed.slice(0,2).join("; ")+(agreed.length>2?` +${agreed.length-2} more`:"") : agreed) : null;
            return (
              <Card key={t.id} onClick={()=>{setWizardIdx(i);if(s==="conflict"&&!agreed){setConflictId(t.id);setPhase("conflict");}else setPhase("wizard");}} style={{cursor:"pointer"}}>
                <div style={{padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
                  <div style={{width:36,height:36,borderRadius:10,background:agreed?T.teal10:T.g50,display:"flex",alignItems:"center",justifyContent:"center",color:agreed?T.teal:T.g400,flexShrink:0}}>
                    <TopicIcon id={t.icon} size={18}/>

                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:700,color:T.g800}}>{t.label}{t.isCustom&&<span style={{fontSize:10,color:T.purple,fontWeight:600,marginLeft:6,background:T.purple10,padding:"1px 6px",borderRadius:10}}>Custom</span>}</div>
                    {displayVal
                      ? <div style={{fontSize:12,color:T.teal,marginTop:2,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{displayVal}</div>
                      : s==="conflict"

                    }

                  <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                    <Pill label={statusLabel} color={statusColor}/>
                    {agreed?<span style={{color:T.mint}}>{Icon.check}</span>:<span style={{color:T.g300}}>{Icon.arrowR}</span>}
                  </div>
                </div>
              </Card>
            );
          })}
        </div>

        {/* Add custom topic */}
        {showAddTopic ? (
          <Card style={{padding:16,border:`1.5px solid ${T.purple}`,background:T.purple10}}>
            <div style={{fontSize:13,fontWeight:700,color:T.purple,marginBottom:10}}>Add a custom topic</div>
            <div style={{fontSize:12,color:T.g500,marginBottom:10,lineHeight:1.5}}>Add any house rule the system didn't cover. You'll type the agreed decision directly.</div>
            <input value={newTopicLabel} onChange={e=>setNewTopicLabel(e.target.value)} placeholder="Topic name (e.g. Pet Policy, Parking)" style={{...inp,marginBottom:8}}/>
            <input value={newTopicQ} onChange={e=>setNewTopicQ(e.target.value)} placeholder="Question to discuss (optional)" style={{...inp,marginBottom:12}}/>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>{
                if(!newTopicLabel.trim())return;
                const id="custom_"+Date.now();
                setCustomTopics(ct=>[...ct,{id,label:newTopicLabel.trim(),question:newTopicQ.trim()||`What is the household rule for ${newTopicLabel.trim()}?`}]);
                setNewTopicLabel("");setNewTopicQ("");setShowAddTopic(false);
              }} style={{flex:1,background:T.purple,border:"none",borderRadius:9,padding:"10px",color:T.white,fontWeight:700,fontSize:13}}>Add Topic</button>
              <button onClick={()=>{setShowAddTopic(false);setNewTopicLabel("");setNewTopicQ("");}} style={{flex:1,background:T.white,border:`1.5px solid ${T.g200}`,borderRadius:9,padding:"10px",color:T.g500,fontSize:13}}>Cancel</button>
            </div>
          </Card>
        ) : (
          <button onClick={()=>setShowAddTopic(true)} style={{width:"100%",background:T.white,border:`1.5px dashed ${T.g300}`,borderRadius:12,padding:"13px",color:T.purple,fontSize:13,fontWeight:600,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
            {Icon.plus} Add a custom topic
          </button>
        )}
      </div>
    </div>
  );
}

// ── CHORES ────────────────────────────────────────────────────────────────────
// rotation modes: "auto" = system assigns each week by rotating; "manual" = fixed assignment
// CHORE_TEMPLATES: the master list of chores and how they rotate
const CHORE_TEMPLATES_INIT = [
  { id:1, task:"Vacuum living room",   rotation:"auto",  freq:"weekly",  assignedTo:null },
  { id:2, task:"Clean bathroom",       rotation:"auto",  freq:"weekly",  assignedTo:null },
  { id:3, task:"Take out recycling",   rotation:"auto",  freq:"weekly",  assignedTo:null },
  { id:4, task:"Wipe kitchen counters",rotation:"auto",  freq:"weekly",  assignedTo:null },
  { id:5, task:"Mop kitchen floor",    rotation:"auto",  freq:"weekly",  assignedTo:null },
  { id:6, task:"Clean stovetop",       rotation:"manual",freq:"weekly",  assignedTo:2    },
  { id:7, task:"Empty dishwasher",     rotation:"manual",freq:"weekly",  assignedTo:2    },
  { id:8, task:"Clean toilet",         rotation:"manual",freq:"weekly",  assignedTo:3    },
  { id:9, task:"Take out trash",       rotation:"auto",  freq:"weekly",  assignedTo:null },
  { id:10,task:"Sweep entryway",       rotation:"auto",  freq:"weekly",  assignedTo:null },
];

// Auto-rotate: distribute chores across members round-robin based on week number
function autoAssign(templates, weekOffset=0, members=MEMBERS_DEFAULT) {
  const autoChores = templates.filter(t => t.rotation === "auto");
  return templates.map(t => {
    if (t.rotation === "manual") return { ...t, who: t.assignedTo };
    const idx = autoChores.findIndex(a => a.id === t.id);
    const who = members[(idx + weekOffset) % members.length].id;
    return { ...t, who };
  });
}

function buildWeekChores(templates, weekOffset, existingDone={}, members=MEMBERS_DEFAULT) {
  return autoAssign(templates, weekOffset, members).map((t,i) => ({
    id: t.id,
    task: t.task,
    who: t.who,
    rotation: t.rotation,
    due: "This week",
    done: existingDone[t.id] || false,
    late: false,
  }));
}

function Chores({members}) {
  const MEMBERS = members || MEMBERS_DEFAULT;
  const [templates, setTemplates]   = useState(CHORE_TEMPLATES_INIT);
  const [weekOffset, setWeekOffset] = useState(0);
  const [doneSets, setDoneSets]     = useState({ 0: {1:true,2:true,4:true,5:true,6:true} });
  const [view, setView]             = useState("mine");   // mine | household | manage
  const [addModal, setAddModal]     = useState(false);
  const [editChore, setEditChore]   = useState(null);     // template id being edited
  const [newTask, setNewTask]       = useState("");
  const [newRotation, setNewRotation] = useState("auto");
  const [newAssignee, setNewAssignee] = useState(1);
  const [confirmDelete, setConfirmDelete] = useState(null);

  const weekNames = ["This week","Next week","Week after"];
  const pastWeekNames = ["Last week","2 weeks ago"];
  const weekLabel = weekOffset === 0 ? "This week" : weekOffset > 0 ? weekNames[weekOffset]||`+${weekOffset}w` : pastWeekNames[-weekOffset-1]||`${weekOffset}w`;

  const chores = buildWeekChores(templates, weekOffset, doneSets[weekOffset]||{}, MEMBERS);

  function toggleDone(id) {
    setDoneSets(ds => {
      const curr = ds[weekOffset] || {};
      const next = { ...curr, [id]: !curr[id] };
      return { ...ds, [weekOffset]: next };
    });
  }

  function addChore() {
    if (!newTask.trim()) return;
    const id = Date.now();
    setTemplates(ts => [...ts, {
      id, task: newTask.trim(),
      rotation: newRotation,
      freq: "weekly",
      assignedTo: newRotation === "manual" ? newAssignee : null,
    }]);
    setNewTask(""); setNewRotation("auto"); setNewAssignee(1); setAddModal(false);
  }

  function updateChore(id) {
    setTemplates(ts => ts.map(t => t.id === id ? {
      ...t, task: newTask||t.task,
      rotation: newRotation,
      assignedTo: newRotation === "manual" ? newAssignee : null,
    } : t));
    setEditChore(null); setNewTask(""); setNewRotation("auto"); setNewAssignee(1);
  }

  function deleteChore(id) {
    setTemplates(ts => ts.filter(t => t.id !== id));
    setConfirmDelete(null);
  }

  function openEdit(t) {
    setEditChore(t.id); setNewTask(t.task);
    setNewRotation(t.rotation); setNewAssignee(t.assignedTo || 1);
  }

  const my    = chores.filter(c => c.who === 1);
  const myDone= my.filter(c => c.done).length;
  const myPct = my.length ? Math.round((myDone/my.length)*100) : 100;
  const total = chores.length;
  const tdone = chores.filter(c => c.done).length;
  const tlate = chores.filter(c => c.late && !c.done).length;
  const stats = MEMBERS.map(m => {
    const mc = chores.filter(c => c.who === m.id);
    const md = mc.filter(c => c.done).length;
    const lc = mc.filter(c => c.late && !c.done).length;
    return { ...m, total:mc.length, done:md, pct:mc.length?Math.round((md/mc.length)*100):100, late:lc, chores:mc };
  });

  // ── MANAGE VIEW ──
  if (view === "manage") return (
    <div style={{background:T.g50,minHeight:"100vh",paddingBottom:80}}>
      <TopBar title="Manage Chores" sub="Configure tasks & rotation"
        right={<button onClick={()=>setView("mine")} style={{background:"none",border:"none",color:T.teal,fontSize:13,fontWeight:600}}>Done</button>}/>

      {/* Rotation explainer */}
      <div style={{padding:"12px 16px 0"}}>
        <Card style={{padding:14,marginBottom:12,background:T.teal10,border:`1px solid ${T.teal20}`}}>
          <div style={{fontSize:13,fontWeight:700,color:T.tealDk,marginBottom:6}}>How auto-rotation works</div>
          <div style={{fontSize:12,color:T.g600,lineHeight:1.6}}>
            Chores set to <strong>Auto-rotate</strong> are distributed evenly across all members each week. The assignment shifts by one person every week so no one gets the same chores repeatedly. Chores set to <strong>Fixed</strong> always go to the same person.
          </div>
          <div style={{display:"flex",gap:6,marginTop:10}}>
            {MEMBERS.map((m,i) => (
              <div key={m.id} style={{flex:1,background:T.white,borderRadius:8,padding:"6px 4px",textAlign:"center",border:`1px solid ${T.teal20}`}}>
                <Av m={m} size={24}/>
                <div style={{fontSize:10,color:T.tealDk,marginTop:4,fontWeight:600}}>{m.short}</div>
                <div style={{fontSize:9,color:T.g400,marginTop:1}}>Week {weekOffset+1}</div>
              </div>
            ))}
          </div>
          <div style={{fontSize:11,color:T.g500,marginTop:8}}>
            Auto chores: <strong>{templates.filter(t=>t.rotation==="auto").length}</strong> rotating across {MEMBERS.length} members · <strong>{Math.ceil(templates.filter(t=>t.rotation==="auto").length/MEMBERS.length)}</strong> per person
          </div>
        </Card>

        {/* Week navigator */}
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,padding:"10px 14px",background:T.white,border:`1px solid ${T.g200}`,borderRadius:12}}>
          <button onClick={()=>setWeekOffset(w=>w-1)} style={{background:T.g100,border:"none",borderRadius:8,width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",color:T.g600}}>{Icon.arrowL}</button>
          <div style={{flex:1,textAlign:"center"}}>
            <div style={{fontSize:14,fontWeight:700,color:T.g800}}>{weekLabel}</div>
            <div style={{fontSize:11,color:T.g400}}>Preview rotation</div>
          </div>
          <button onClick={()=>setWeekOffset(w=>w+1)} style={{background:T.g100,border:"none",borderRadius:8,width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",color:T.g600}}>{Icon.arrowR}</button>
        </div>

        {/* Chore list with assignment preview */}
        <div style={{fontSize:11,fontWeight:700,color:T.g400,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>
          All chores ({templates.length})
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
          {chores.map(c => {
            const t = templates.find(x=>x.id===c.id);
            const assignee = MEMBERS.find(m=>m.id===c.who);
            const isEditing = editChore === c.id;

            if (isEditing) return (
              <Card key={c.id} style={{border:`1.5px solid ${T.teal}`,background:T.teal10}}>
                <div style={{padding:14}}>
                  <div style={{fontSize:12,fontWeight:700,color:T.teal,marginBottom:10}}>Editing chore</div>
                  <input value={newTask} onChange={e=>setNewTask(e.target.value)} style={{...inp,marginBottom:10,background:T.white}} placeholder="Task name"/>
                  <div style={{fontSize:12,fontWeight:600,color:T.g500,marginBottom:8}}>Assignment type</div>
                  <div style={{display:"flex",gap:6,marginBottom:newRotation==="manual"?10:14}}>
                    {[{v:"auto",label:"Auto-rotate"},{v:"manual",label:"Fixed person"}].map(opt=>(
                      <button key={opt.v} onClick={()=>setNewRotation(opt.v)} style={{flex:1,background:newRotation===opt.v?T.teal:T.white,border:`1.5px solid ${newRotation===opt.v?T.teal:T.g200}`,borderRadius:8,padding:"8px",color:newRotation===opt.v?T.white:T.g600,fontSize:12,fontWeight:600}}>
                        {opt.label}
                      </button>
                    ))}
                  </div>
                  {newRotation==="manual"&&<>
                    <div style={{fontSize:12,fontWeight:600,color:T.g500,marginBottom:8}}>Assign to</div>
                    <div style={{display:"flex",gap:6,marginBottom:14}}>
                      {MEMBERS.map(m=>(
                        <button key={m.id} onClick={()=>setNewAssignee(m.id)} style={{flex:1,background:newAssignee===m.id?m.color:T.white,border:`1.5px solid ${newAssignee===m.id?m.color:T.g200}`,borderRadius:8,padding:"8px 4px",display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                          <Av m={m} size={24}/>
                          <span style={{fontSize:11,color:newAssignee===m.id?T.white:T.g600,fontWeight:600}}>{m.short}</span>
                        </button>
                      ))}
                    </div>
                  </>}
                  <div style={{display:"flex",gap:8}}>
                    <button onClick={()=>updateChore(c.id)} style={{flex:1,background:T.teal,border:"none",borderRadius:8,padding:"9px",color:T.white,fontWeight:700,fontSize:13}}>Save</button>
                    <button onClick={()=>{setEditChore(null);setNewTask("");}} style={{flex:1,background:T.white,border:`1.5px solid ${T.g200}`,borderRadius:8,padding:"9px",color:T.g500,fontSize:13}}>Cancel</button>
                  </div>
                </div>
              </Card>
            );

            return (
              <Card key={c.id}>
                <div style={{padding:"12px 14px",display:"flex",alignItems:"center",gap:10}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600,color:T.g800,marginBottom:4}}>{c.task}</div>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <Pill label={t?.rotation==="auto"?"Auto-rotate":"Fixed"} color={t?.rotation==="auto"?T.teal:T.purple}/>
                      <div style={{display:"flex",alignItems:"center",gap:4}}>
                        <Av m={assignee} size={16}/>
                        <span style={{fontSize:11,color:T.g500}}>{weekLabel}: {assignee?.short}</span>
                      </div>
                    </div>
                  </div>
                  <div style={{display:"flex",gap:6,flexShrink:0}}>
                    <button onClick={()=>openEdit(t)} style={{background:T.g100,border:"none",borderRadius:8,width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",color:T.g500}}>
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </button>
                    <button onClick={()=>setConfirmDelete(c.id)} style={{background:T.red10,border:"none",borderRadius:8,width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",color:T.red}}>
                      {Icon.trash}
                    </button>
                  </div>
                </div>
              </Card>
            );
          })}
        </div>

        {/* Add new chore */}
        {addModal ? (
          <Card style={{padding:14,border:`1.5px solid ${T.teal}`,background:T.teal10}}>
            <div style={{fontSize:13,fontWeight:700,color:T.tealDk,marginBottom:10}}>New chore</div>
            <input value={newTask} onChange={e=>setNewTask(e.target.value)} placeholder="e.g. Wipe windows" style={{...inp,marginBottom:10,background:T.white}}/>
            <div style={{fontSize:12,fontWeight:600,color:T.g500,marginBottom:8}}>Assignment type</div>
            <div style={{display:"flex",gap:6,marginBottom:newRotation==="manual"?10:14}}>
              {[{v:"auto",label:"Auto-rotate"},{v:"manual",label:"Fixed person"}].map(opt=>(
                <button key={opt.v} onClick={()=>setNewRotation(opt.v)} style={{flex:1,background:newRotation===opt.v?T.teal:T.white,border:`1.5px solid ${newRotation===opt.v?T.teal:T.g200}`,borderRadius:8,padding:"8px",color:newRotation===opt.v?T.white:T.g600,fontSize:12,fontWeight:600}}>
                  {opt.label}
                </button>
              ))}
            </div>
            {newRotation==="manual"&&<>
              <div style={{fontSize:12,fontWeight:600,color:T.g500,marginBottom:8}}>Always assigned to</div>
              <div style={{display:"flex",gap:6,marginBottom:14}}>
                {MEMBERS.map(m=>(
                  <button key={m.id} onClick={()=>setNewAssignee(m.id)} style={{flex:1,background:newAssignee===m.id?m.color:T.white,border:`1.5px solid ${newAssignee===m.id?m.color:T.g200}`,borderRadius:8,padding:"8px 4px",display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                    <Av m={m} size={24}/>
                    <span style={{fontSize:11,color:newAssignee===m.id?T.white:T.g600,fontWeight:600}}>{m.short}</span>
                  </button>
                ))}
              </div>
            </>}
            <div style={{display:"flex",gap:8}}>
              <button onClick={addChore} style={{flex:1,background:T.teal,border:"none",borderRadius:8,padding:"10px",color:T.white,fontWeight:700,fontSize:13}}>Add Chore</button>
              <button onClick={()=>{setAddModal(false);setNewTask("");}} style={{flex:1,background:T.white,border:`1.5px solid ${T.g200}`,borderRadius:8,padding:"10px",color:T.g500,fontSize:13}}>Cancel</button>
            </div>
          </Card>
        ) : (
          <button onClick={()=>setAddModal(true)} style={{width:"100%",background:T.white,border:`1.5px dashed ${T.g300}`,borderRadius:12,padding:"13px",color:T.teal,fontSize:14,fontWeight:600,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
            {Icon.plus} Add a chore
          </button>
        )}
      </div>

      {/* Delete confirmation modal */}
      {confirmDelete&&<div style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:24}}>
        <Card style={{padding:20,width:"100%",maxWidth:340}}>
          <div style={{fontSize:16,fontWeight:700,color:T.g900,marginBottom:8}}>Remove this chore?</div>
          <div style={{fontSize:13,color:T.g500,marginBottom:20}}>"{templates.find(t=>t.id===confirmDelete)?.task}" will be removed from the rotation permanently.</div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>deleteChore(confirmDelete)} style={{flex:1,background:T.red,border:"none",borderRadius:9,padding:"11px",color:T.white,fontWeight:700,fontSize:14}}>Remove</button>
            <button onClick={()=>setConfirmDelete(null)} style={{flex:1,background:T.white,border:`1.5px solid ${T.g200}`,borderRadius:9,padding:"11px",color:T.g600,fontSize:14}}>Cancel</button>
          </div>
        </Card>
      </div>}
    </div>
  );

  // ── MINE + HOUSEHOLD VIEWS ──
  return <div style={{background:T.g50,minHeight:"100vh",paddingBottom:80}}>
    <TopBar title="Chore Rotation" sub={weekLabel}
      right={<button onClick={()=>setView("manage")} style={{background:T.g100,border:"none",borderRadius:20,padding:"6px 14px",color:T.g700,fontSize:12,fontWeight:600,display:"flex",alignItems:"center",gap:6}}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        Manage
      </button>}/>

    {/* Week nav strip */}
    <div style={{padding:"10px 16px 0",display:"flex",alignItems:"center",gap:8}}>
      <button onClick={()=>setWeekOffset(w=>w-1)} style={{background:T.white,border:`1px solid ${T.g200}`,borderRadius:8,width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",color:T.g500,flexShrink:0}}>{Icon.arrowL}</button>
      <div style={{flex:1,textAlign:"center",fontSize:13,fontWeight:600,color:T.g700}}>{weekLabel}</div>
      <button onClick={()=>setWeekOffset(w=>w+1)} style={{background:T.white,border:`1px solid ${T.g200}`,borderRadius:8,width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",color:T.g500,flexShrink:0}}>{Icon.arrowR}</button>

      {["mine","household"].map(v=><button key={v} onClick={()=>setView(v)} style={{flex:1,background:view===v?T.teal:T.white,border:`1.5px solid ${view===v?T.teal:T.g200}`,borderRadius:10,padding:"9px",color:view===v?T.white:T.g600,fontSize:13,fontWeight:600}}>{v==="mine"?"My Chores":"Household"}</button>)}
    </div>

    {view==="mine"?<div style={{padding:"12px 16px"}}>
      <Card style={{padding:16,marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",gap:16}}>
