            {myPct===100&&<div style={{marginTop:6}}><Pill label="All done" color={T.mint}/></div>}
          </div>
        </div>
      </Card>
      {my.length===0
        ? <div style={{textAlign:"center",padding:"32px 0",color:T.g400,fontSize:13}}>No chores assigned to you this week.</div>
        : <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {my.map(c=>(
            <button key={c.id} onClick={()=>toggleDone(c.id)} style={{display:"flex",alignItems:"center",gap:12,background:T.white,border:`1px solid ${c.done?T.teal+"44":T.g200}`,borderRadius:12,padding:"12px 14px",textAlign:"left",boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
              <div style={{width:24,height:24,borderRadius:6,background:c.done?T.teal:T.white,border:`2px solid ${c.done?T.teal:T.g300}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,color:T.white}}>{c.done&&Icon.check}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:500,color:c.done?T.g400:T.g800,textDecoration:c.done?"line-through":"none"}}>{c.task}</div>
                <div style={{display:"flex",alignItems:"center",gap:6,marginTop:3}}>
                  <Pill label={c.rotation==="auto"?"Auto-assigned":"Fixed"} color={c.rotation==="auto"?T.teal:T.purple}/>
                </div>
              </div>
              {c.done&&<Pill label="Done" color={T.mint}/>}
            </button>
          ))}
        </div>
      }
    </div>:<div style={{padding:"12px 16px"}}>
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        {[{l:"Completion",v:`${total?Math.round((tdone/total)*100):100}%`,c:T.teal},{l:"Done",v:tdone,c:T.mint},{l:"Overdue",v:tlate,c:tlate>0?T.red:T.mint}].map(s=><Card key={s.l} style={{flex:1,padding:"10px 8px",textAlign:"center"}}><div style={{fontSize:20,fontWeight:800,color:s.c}}>{s.v}</div><div style={{fontSize:10,color:T.g400,marginTop:2,fontWeight:500}}>{s.l}</div></Card>)}
      </div>
      {stats.map(m=>(
        <Card key={m.id} style={{marginBottom:10,border:`1.5px solid ${m.late>0?T.red+"44":T.g200}`,background:m.late>0?T.red10:T.white}}>
          <div style={{padding:"14px 16px"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
              <Av m={m} size={38}/>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:700,color:m.late>0?T.red:T.g800}}>{m.name}</div>
                <div style={{fontSize:12,color:T.g400}}>{m.done}/{m.total} done · {m.late>0?`${m.late} overdue`:"on track"}</div>
              </div>
              <Ring pct={m.pct} size={44} sw={4} color={m.pct===100?T.mint:m.late>0?T.red:T.amber}/>
            </div>
            <Bar pct={m.pct} color={m.late>0?T.red:T.teal}/>
            {m.chores.length>0&&<div style={{marginTop:10,display:"flex",flexDirection:"column",gap:5}}>
              {m.chores.map(c=><div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0"}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <div style={{width:16,height:16,borderRadius:4,background:c.done?T.teal:T.white,border:`1.5px solid ${c.done?T.teal:T.g300}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                    {c.done&&<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>}
                  </div>
                  <span style={{fontSize:12,color:c.done?T.g400:T.g600,textDecoration:c.done?"line-through":"none"}}>{c.task}</span>
                </div>
                {c.late&&<Pill label="Overdue" color={T.red}/>}
                {c.done&&<Pill label="Done" color={T.mint}/>}
              </div>)}
            </div>}
          </div>
        </Card>
      ))}
    </div>}
  </div>;
}


// ── EXPENSES ─────────────────────────────────────────────────────────────────
// HOW THIS WORKS:
// - One person pays a shared bill upfront (e.g. Xiaowan pays $87.50 hydro).
// - Each other member owes their equal share ($29.17 each).
// - "Mark as paid" = confirming you have paid the person back in real life
//   (cash, e-transfer, etc). Money does NOT move through the app.
// - Once all members have marked their share as paid, the expense is fully settled.

const CATEGORIES = ["utilities","household","subscriptions","food","transport","other"];
const CAT_LABELS  = {utilities:"Utilities",household:"Household",subscriptions:"Subscriptions",food:"Food",transport:"Transport",other:"Other"};
const CAT_COLORS  = {utilities:T.blue,household:T.teal,subscriptions:T.purple,food:T.amber,transport:T.mint,other:T.g400};

function expenseShare(amount, n) { return Math.round((amount/n)*100)/100; }

function isFullySettled(exp) {
  return Object.values(exp.settled).every(v => v === true);
}

function Expenses({members}) {
  const MEMBERS = members || MEMBERS_DEFAULT;
  const n = MEMBERS.length;
  const [exps,    setExps]    = useState(EXPENSES_INIT);
  const [addOpen, setAddOpen] = useState(false);
  const [detail,  setDetail]  = useState(null); // expense id being viewed in detail
  const [newDesc, setNewDesc] = useState("");
  const [newAmt,  setNewAmt]  = useState("");
  const [newBy,   setNewBy]   = useState(1);
  const [newCat,  setNewCat]  = useState("household");

  // Running balances: for each member, how much do they owe vs are owed
  // for unsettled shares only
  const balances = MEMBERS.map(m => {
    let owes = 0;   // m owes others (m is a debtor on expenses paid by others)
    let owed = 0;   // others owe m (m paid upfront, some haven't paid back yet)
    exps.forEach(e => {
      const share = expenseShare(e.amount, n);
      if (e.by === m.id) {
        // m paid — count unsettled shares owed TO m
        Object.entries(e.settled).forEach(([mid, paid]) => {
          if (!paid) owed += share;
        });
      } else {
        // m is a debtor — does m still owe their share?
        if (e.settled[m.id] === false) owes += share;
      }
    });
    const net = Math.round((owed - owes)*100)/100;
    return { ...m, owes: Math.round(owes*100)/100, owed: Math.round(owed*100)/100, net };
  });

  // Total pending (sum of all unsettled shares across all expenses)
  const totalPending = exps.reduce((sum, e) => {
    const share = expenseShare(e.amount, n);
    return sum + Object.values(e.settled).filter(v => !v).length * share;
  }, 0);

  function markPaid(expId, memberId, paid) {
    setExps(es => es.map(e => e.id === expId
      ? { ...e, settled: { ...e.settled, [memberId]: paid } }
      : e
    ));
  }

  function addExpense() {
    if (!newDesc.trim() || !newAmt) return;
    const others = MEMBERS.filter(m => m.id !== newBy).reduce((o, m) => ({ ...o, [m.id]: false }), {});
    setExps(es => [...es, {
      id: Date.now(), desc: newDesc.trim(),
      amount: parseFloat(newAmt), by: newBy,
      date: "Apr 10", category: newCat, settled: others,
    }]);
    setNewDesc(""); setNewAmt(""); setNewBy(1); setNewCat("household"); setAddOpen(false);
  }

  function deleteExpense(id) { setExps(es => es.filter(e => e.id !== id)); setDetail(null); }

  // ── DETAIL MODAL ──
  if (detail !== null) {
    const e = exps.find(x => x.id === detail);
    if (!e) { setDetail(null); return null; }
    const payer = MEMBERS.find(m => m.id === e.by);
    const share = expenseShare(e.amount, n);
    const fullySettled = isFullySettled(e);

    return (
      <div style={{background:T.g50,minHeight:"100vh",paddingBottom:80}}>
        <TopBar title={e.desc} sub={`${e.date} · ${CAT_LABELS[e.category]||"Other"}`} back={()=>setDetail(null)}
          right={<button onClick={()=>deleteExpense(e.id)} style={{background:T.red10,border:"none",borderRadius:8,padding:"6px 10px",color:T.red,fontSize:12,fontWeight:600}}>{Icon.trash}</button>}/>
        <div style={{padding:"14px 16px"}}>

          {/* How it works banner */}
          <div style={{background:T.blue10,border:`1px solid ${T.blue}22`,borderRadius:12,padding:"10px 14px",marginBottom:14,display:"flex",gap:10,alignItems:"flex-start"}}>
            <span style={{color:T.blue,flexShrink:0,marginTop:1}}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            </span>
            <div style={{fontSize:12,color:T.blue,lineHeight:1.5}}>
              <strong>{payer.short}</strong> paid <strong>${e.amount.toFixed(2)}</strong> upfront.
              Each person owes <strong>${share.toFixed(2)}</strong> back to {payer.short} outside the app — cash, e-transfer, or however you prefer.
              Tap <strong>"Mark as paid"</strong> once you've paid them back in real life.
            </div>
          </div>

          {/* Amount summary card */}
          <Card style={{padding:"16px 18px",marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
              <div>
                <div style={{fontSize:13,fontWeight:600,color:T.g400,marginBottom:4}}>Total paid upfront</div>
                <div style={{fontSize:28,fontWeight:800,color:T.g900}}>${e.amount.toFixed(2)}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:13,fontWeight:600,color:T.g400,marginBottom:4}}>Per person</div>
                <div style={{fontSize:28,fontWeight:800,color:T.teal}}>${share.toFixed(2)}</div>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,paddingTop:12,borderTop:`1px solid ${T.g100}`}}>
              <Av m={payer} size={28}/>
              <div style={{flex:1}}>
                <span style={{fontSize:13,fontWeight:600,color:T.g700}}>{payer.name}</span>
                <span style={{fontSize:12,color:T.g400}}> paid the full bill</span>
              </div>
              <Pill label="Bill payer" color={T.teal}/>
            </div>
          </Card>

          {/* Per-member payment status */}
          <div style={{fontSize:11,fontWeight:700,color:T.g400,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>
            Who has paid {payer.short} back
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
            {MEMBERS.filter(m => m.id !== e.by).map(m => {
              const paid = e.settled[m.id];
              return (
                <Card key={m.id} style={{border:`1.5px solid ${paid?T.mint+"66":T.red+"33"}`,background:paid?T.teal10:T.white}}>
                  <div style={{padding:"13px 16px",display:"flex",alignItems:"center",gap:12}}>
                    <Av m={m} size={36}/>
                    <div style={{flex:1}}>
                      <div style={{fontSize:14,fontWeight:600,color:T.g800}}>{m.name}</div>
                      <div style={{fontSize:12,color:T.g400,marginTop:2}}>
                        {paid
                          ? `Paid ${payer.short} back $${share.toFixed(2)}`
                          : `Owes ${payer.short} $${share.toFixed(2)}`
                        }
                      </div>
                    </div>
                    {paid
                      ? <div style={{display:"flex",alignItems:"center",gap:6,color:T.mint}}>
                          <span style={{color:T.mint}}>{Icon.check}</span>
                          <span style={{fontSize:12,fontWeight:700,color:T.mint}}>Paid</span>
                          <button onClick={()=>markPaid(e.id,m.id,false)} style={{background:"none",border:"none",color:T.g400,fontSize:11,marginLeft:4}}>undo</button>
                        </div>
                      : <button onClick={()=>markPaid(e.id,m.id,true)} style={{background:T.teal,border:"none",borderRadius:9,padding:"7px 14px",color:T.white,fontSize:12,fontWeight:700}}>
                          Mark as paid
                        </button>
                    }
                  </div>
                </Card>
              );
            })}
          </div>

          {fullySettled && (
            <div style={{background:T.teal10,border:`1px solid ${T.teal20}`,borderRadius:12,padding:"12px 16px",display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
              <span style={{color:T.teal}}>{Icon.check}</span>
              <div>
                <div style={{fontSize:13,fontWeight:700,color:T.teal}}>Fully settled</div>
                <div style={{fontSize:12,color:T.g500}}>Everyone has paid {payer.short} back for this expense.</div>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  // ── MAIN LIST VIEW ──
  const unsettled = exps.filter(e => !isFullySettled(e));
  const settled   = exps.filter(e => isFullySettled(e));

  return (
    <div style={{background:T.g50,minHeight:"100vh",paddingBottom:80}}>
      <TopBar title="Expense Tracker" sub={`$${totalPending.toFixed(2)} pending payback`}
        right={<button onClick={()=>setAddOpen(a=>!a)} style={{background:T.teal,border:"none",borderRadius:20,padding:"7px 16px",color:T.white,fontSize:13,fontWeight:700,display:"flex",alignItems:"center",gap:6}}>{Icon.plus}Add</button>}/>

      {/* Add expense form */}
      {addOpen && (
        <div style={{padding:"12px 16px 0"}}>
          <Card style={{padding:16}}>
            <div style={{fontSize:13,fontWeight:700,color:T.g700,marginBottom:12}}>New shared expense</div>
            <input value={newDesc} onChange={e=>setNewDesc(e.target.value)} placeholder="What was it? (e.g. Netflix, Groceries)" style={{...inp,marginBottom:10}}/>
            <input value={newAmt} onChange={e=>setNewAmt(e.target.value)} placeholder="Total amount ($)" type="number" style={{...inp,marginBottom:10}}/>

            <div style={{fontSize:12,fontWeight:600,color:T.g500,marginBottom:8}}>Who paid upfront?</div>
            <div style={{display:"flex",gap:6,marginBottom:12}}>
              {MEMBERS.map(m=>(
                <button key={m.id} onClick={()=>setNewBy(m.id)} style={{flex:1,background:newBy===m.id?m.color:T.white,border:`1.5px solid ${newBy===m.id?m.color:T.g200}`,borderRadius:9,padding:"8px 4px",display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                  <Av m={m} size={24}/>
                  <span style={{fontSize:11,color:newBy===m.id?T.white:T.g600,fontWeight:600}}>{m.short}</span>
                </button>
              ))}
            </div>

            <div style={{fontSize:12,fontWeight:600,color:T.g500,marginBottom:8}}>Category</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
              {CATEGORIES.map(cat=>(
                <button key={cat} onClick={()=>setNewCat(cat)} style={{background:newCat===cat?CAT_COLORS[cat]:T.white,border:`1.5px solid ${newCat===cat?CAT_COLORS[cat]:T.g200}`,borderRadius:20,padding:"5px 12px",color:newCat===cat?T.white:T.g600,fontSize:12,fontWeight:500}}>
                  {CAT_LABELS[cat]}
                </button>
              ))}
            </div>

            {newDesc && newAmt && (
              <div style={{background:T.teal10,border:`1px solid ${T.teal20}`,borderRadius:8,padding:"8px 12px",marginBottom:10,fontSize:12,color:T.tealDk}}>
                Each person owes <strong>${expenseShare(parseFloat(newAmt)||0, n).toFixed(2)}</strong> back to {MEMBERS.find(m=>m.id===newBy)?.short}
              </div>
            )}

            <div style={{display:"flex",gap:8}}>
              <button onClick={addExpense} style={{flex:1,background:T.teal,border:"none",borderRadius:9,padding:"10px",color:T.white,fontWeight:700,fontSize:13}}>Add</button>
              <button onClick={()=>setAddOpen(false)} style={{flex:1,background:T.white,border:`1.5px solid ${T.g200}`,borderRadius:9,padding:"10px",color:T.g500,fontSize:13}}>Cancel</button>
            </div>
          </Card>
        </div>
      )}

      {/* Running balances */}
      <Sec label="Running balances"/>
      <div style={{padding:"0 16px 4px"}}>
        <div style={{fontSize:12,color:T.g400,marginBottom:8,lineHeight:1.5}}>
          <strong style={{color:T.g600}}>How to read this:</strong> A positive balance means others still owe you money. A negative balance means you still owe others.
        </div>
        <div style={{display:"flex",gap:8}}>
          {balances.map(m=>(
            <Card key={m.id} style={{flex:1,padding:"12px 8px",textAlign:"center",border:`1.5px solid ${m.net>0?T.mint+"66":m.net<0?T.red+"44":T.g200}`}}>
              <Av m={m} size={30}/>
              <div style={{fontSize:14,fontWeight:800,color:m.net>0?T.mint:m.net<0?T.red:T.g400,marginTop:7,letterSpacing:-0.3}}>
                {m.net>0?`+$${m.net.toFixed(2)}`:m.net<0?`-$${Math.abs(m.net).toFixed(2)}`:"Settled"}
              </div>
              <div style={{fontSize:10,color:T.g400,marginTop:1}}>{m.short}</div>
              {m.net!==0&&<div style={{fontSize:10,color:T.g400,marginTop:2}}>
                {m.net>0?`is owed $${m.owed.toFixed(2)}`:`owes $${m.owes.toFixed(2)}`}
              </div>}
            </Card>
          ))}
        </div>
      </div>

      {/* Unsettled expenses */}
      {unsettled.length>0&&<>
        <Sec label={`Pending (${unsettled.length})`}/>
        <div style={{padding:"0 16px",display:"flex",flexDirection:"column",gap:8}}>
          {unsettled.map(e => {
            const payer = MEMBERS.find(m=>m.id===e.by);
            const share = expenseShare(e.amount, n);
            const settledCount = Object.values(e.settled).filter(Boolean).length;
            const totalOwers   = Object.keys(e.settled).length;
            const catColor = CAT_COLORS[e.category]||T.g400;
            return (
              <Card key={e.id} onClick={()=>setDetail(e.id)} style={{cursor:"pointer"}}>
                <div style={{padding:"13px 16px"}}>
                  <div style={{display:"flex",alignItems:"flex-start",gap:12,marginBottom:10}}>
                    <div style={{width:38,height:38,borderRadius:10,background:catColor+"18",border:`1px solid ${catColor}33`,display:"flex",alignItems:"center",justifyContent:"center",color:catColor,flexShrink:0}}>
                      {Icon.expenses}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:14,fontWeight:700,color:T.g800}}>{e.desc}</div>
                      <div style={{display:"flex",alignItems:"center",gap:6,marginTop:3}}>
                        <span style={{fontSize:11,color:T.g400}}>Paid by</span>
                        <Av m={payer} size={16}/>
                        <span style={{fontSize:11,color:T.g600,fontWeight:600}}>{payer.short}</span>
                        <span style={{fontSize:11,color:T.g300}}>·</span>
                        <span style={{fontSize:11,color:T.g400}}>{e.date}</span>
                      </div>
                    </div>
                    <div style={{textAlign:"right",flexShrink:0}}>
                      <div style={{fontSize:16,fontWeight:800,color:T.g800}}>${e.amount.toFixed(2)}</div>
                      <div style={{fontSize:11,color:T.g400,marginTop:2}}>${share.toFixed(2)}/person</div>
                    </div>
                  </div>

                  {/* Per-member status row */}
                  <div style={{borderTop:`1px solid ${T.g100}`,paddingTop:10,display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:11,color:T.g400,flexShrink:0}}>Paid back:</span>
                    <div style={{display:"flex",gap:5,flex:1}}>
                      {MEMBERS.filter(m=>m.id!==e.by).map(m=>{
                        const paid=e.settled[m.id];
                        return (
                          <div key={m.id} style={{display:"flex",alignItems:"center",gap:4,background:paid?T.mint+"18":T.red10,borderRadius:20,padding:"3px 8px 3px 4px",border:`1px solid ${paid?T.mint+"44":T.red+"33"}`}}>
                            <Av m={m} size={16}/>
                            <span style={{fontSize:11,fontWeight:600,color:paid?T.mint:T.red}}>{m.short}</span>
                            {paid&&<span style={{color:T.mint,display:"flex"}}><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>}
                          </div>
                        );
                      })}
                    </div>
                    <span style={{color:T.g300,flexShrink:0}}>{Icon.arrowR}</span>
                  </div>

                  {settledCount>0&&<div style={{marginTop:8}}>
                    <Bar pct={(settledCount/totalOwers)*100} color={T.mint} h={4}/>
                    <div style={{fontSize:11,color:T.g400,marginTop:4}}>{settledCount}/{totalOwers} paid back</div>
                  </div>}
                </div>
              </Card>
            );
          })}
        </div>
      </>}

      {/* Fully settled */}
      {settled.length>0&&<>
        <Sec label={`Settled (${settled.length})`}/>
        <div style={{padding:"0 16px",display:"flex",flexDirection:"column",gap:8}}>
          {settled.map(e=>{
            const payer=MEMBERS.find(m=>m.id===e.by);
            return (
              <Card key={e.id} onClick={()=>setDetail(e.id)} style={{opacity:0.6,cursor:"pointer"}}>
                <div style={{padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
                  <Av m={payer} size={32}/>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:600,color:T.g500,textDecoration:"line-through"}}>{e.desc}</div>
                    <div style={{fontSize:11,color:T.g400,marginTop:1}}>Paid by {payer.short} · {e.date} · everyone paid back</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:14,fontWeight:700,color:T.g400}}>${e.amount.toFixed(2)}</div>
                    <Pill label="Settled" color={T.mint}/>
                  </div>
                </div>
              </Card>
            );
          })}
        </div>
      </>}
    </div>
  );
}

  "laundry|Mon Apr 7|2pm":  {memberId:2, recurring:false},
  "laundry|Tue Apr 8|6pm":  {memberId:3, recurring:false},
  "laundry|Wed Apr 9|8am":  {memberId:1, recurring:true},
  "kitchen|Mon Apr 7|7am":  {memberId:1, recurring:true},
  "kitchen|Mon Apr 7|12pm": {memberId:2, recurring:false},
  "shower|Mon Apr 7|7am":   {memberId:1, recurring:true},
  "shower|Mon Apr 7|8am":   {memberId:2, recurring:false},
  "shower|Mon Apr 7|9am":   {memberId:3, recurring:false},
  "living|Mon Apr 7|7pm":   {memberId:2, recurring:false},
};

function Amenities({currentUser,members}) {
  const MEMBERS = members || MEMBERS_DEFAULT;
  const [amenities,setAmenities] = useState(AMENITIES_INIT);
  const [bookings,setBookings]   = useState(BOOKINGS_INIT2);
  const [sel,setSel]             = useState("laundry");
  const [dayIdx,setDayIdx]       = useState(0);
  const [tabView,setTabView]     = useState("book"); // book | all
  const [addForm,setAddForm]     = useState(false);
  const [newLabel,setNewLabel]   = useState("");
  const [bookModal,setBookModal] = useState(null); // {slot}
  const [recurring,setRecurring] = useState(false);

  const day = DAYS[dayIdx];
  const me  = currentUser || {name:"Leticia",initials:"LL"};
  const meId = 1; // current user is always member 1 in this demo

  function key(amenityId, day, slot) { return `${amenityId}|${day}|${slot}`; }
  function getBooking(amenityId, day, slot) { return bookings[key(amenityId,day,slot)]; }
  function isMine(b) { return b && b.memberId === meId; }

  function doBook(slot, rec) {
    const k = key(sel, day, slot);
    if (bookings[k]) return;
    setBookings(b => {
      const nb = {...b, [k]:{memberId:meId, recurring:rec}};
      // if recurring, also fill same slot for remaining days of week
      if (rec) {
        DAYS.forEach((d,i) => {
          if (i > dayIdx) {
            const rk = key(sel,d,slot);
            if (!nb[rk]) nb[rk] = {memberId:meId, recurring:true};
          }
        });
      }
      return nb;
    });
    setBookModal(null);
  }

  function cancelBooking(amenityId, d, slot) {
    const k = key(amenityId,d,slot);
    const bk = bookings[k];
    setBookings(b => {
      const nb = {...b};
      delete nb[k];
      // if recurring cancel all future instances too
      if (bk && bk.recurring) {
        DAYS.forEach(dd => { const rk=key(amenityId,dd,slot); if(nb[rk]&&nb[rk].memberId===meId&&nb[rk].recurring) delete nb[rk]; });
      }
      return nb;
    });
  }

  function addAmenity() {
    if (!newLabel.trim()) return;
    const id = newLabel.toLowerCase().replace(/\s+/g,"-")+"-"+Date.now();
    setAmenities(a=>[...a,{id,label:newLabel.trim(),icon:"living"}]);
    setNewLabel(""); setAddForm(false); setSel(id);
  }

  // All bookings flat list
  const allBookings = Object.entries(bookings).map(([k,v]) => {
    const [amenityId,d,slot] = k.split("|");
    const amenity = amenities.find(a=>a.id===amenityId);
    const member  = MEMBERS.find(m=>m.id===v.memberId);
    return {key:k, amenityId, amenityLabel:amenity?.label||amenityId, day:d, slot, memberId:v.memberId, memberName:member?.short||"?", memberColor:member?.color||T.g400, recurring:v.recurring};
  }).sort((a,b)=>{ const di=DAYS.indexOf(a.day)-DAYS.indexOf(b.day); if(di!==0)return di; return SLOTS.indexOf(a.slot)-SLOTS.indexOf(b.slot); });

  const currSlots = SLOTS.map(slot => ({slot, booking: getBooking(sel,day,slot)}));

  return <div style={{background:T.g50,minHeight:"100vh",paddingBottom:80}}>
    <TopBar title="Amenities Scheduler" sub="Book shared spaces"
      right={<button onClick={()=>setAddForm(a=>!a)} style={{background:T.teal,border:"none",borderRadius:20,padding:"7px 14px",color:T.white,fontSize:13,fontWeight:700,display:"flex",alignItems:"center",gap:6}}>{Icon.plus}Add</button>}/>

    {/* Add amenity form */}
    {addForm&&<div style={{padding:"12px 16px 0"}}>
      <Card style={{padding:14}}>
        <div style={{fontSize:13,fontWeight:700,color:T.g700,marginBottom:10}}>Add a new amenity</div>
        <input value={newLabel} onChange={e=>setNewLabel(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addAmenity()} placeholder="e.g. Gym, Parking, BBQ" style={{...inp,marginBottom:10}}/>
        <div style={{display:"flex",gap:8}}>
          <button onClick={addAmenity} style={{flex:1,background:T.teal,border:"none",borderRadius:9,padding:"10px",color:T.white,fontWeight:700,fontSize:13}}>Add</button>
          <button onClick={()=>setAddForm(false)} style={{flex:1,background:T.white,border:`1.5px solid ${T.g200}`,borderRadius:9,padding:"10px",color:T.g500,fontSize:13}}>Cancel</button>
        </div>
      </Card>
    </div>}

    {/* View toggle */}
    <div style={{padding:"12px 16px 0",display:"flex",gap:6}}>
      {[{id:"book",label:"Book"},{id:"all",label:"All Bookings"}].map(t=>(
        <button key={t.id} onClick={()=>setTabView(t.id)} style={{flex:1,background:tabView===t.id?T.teal:T.white,border:`1.5px solid ${tabView===t.id?T.teal:T.g200}`,borderRadius:10,padding:"9px",color:tabView===t.id?T.white:T.g600,fontSize:13,fontWeight:600}}>
          {t.label}
        </button>
      ))}
    </div>

    {tabView==="book"&&<>
      {/* Amenity tiles */}
      <div style={{padding:"12px 16px 0",display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {amenities.map(a=>{
          const cnt = Object.keys(bookings).filter(k=>k.startsWith(a.id+"|")).length;
          return <button key={a.id} onClick={()=>setSel(a.id)} style={{background:sel===a.id?T.teal10:T.white,border:`2px solid ${sel===a.id?T.teal:T.g200}`,borderRadius:12,padding:"13px 12px",display:"flex",alignItems:"center",gap:10,boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
            <span style={{color:sel===a.id?T.teal:T.g500}}><TopicIcon id={a.icon} size={20}/></span>
            <div style={{textAlign:"left",minWidth:0}}>
              <div style={{fontSize:13,fontWeight:700,color:sel===a.id?T.teal:T.g800,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.label}</div>
              <div style={{fontSize:11,color:T.g400}}>{cnt} booked</div>
            </div>
          </button>;
        })}
      </div>

      {/* Day strip */}
      <div style={{padding:"12px 16px 0",display:"flex",gap:6,overflowX:"auto"}}>
        {DAYS.map((d,i)=>(
          <button key={d} onClick={()=>setDayIdx(i)} style={{background:dayIdx===i?T.teal:T.white,border:`1.5px solid ${dayIdx===i?T.teal:T.g200}`,borderRadius:10,padding:"6px 0",color:dayIdx===i?T.white:T.g600,fontSize:12,fontWeight:600,flexShrink:0,width:46,display:"flex",flexDirection:"column",alignItems:"center",gap:1}}>
            <span style={{fontSize:10,fontWeight:500,opacity:0.75}}>{SHORT_DAYS[i]}</span>
            <span style={{fontSize:13,fontWeight:700}}>{d.split(" ")[2]}</span>
          </button>
        ))}
      </div>

      {/* Slot list */}
      <div style={{padding:"12px 16px 0"}}>
        <div style={{fontSize:12,fontWeight:700,color:T.g400,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>
          {amenities.find(a=>a.id===sel)?.label} · {day}
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {currSlots.map(({slot,booking})=>{
            const mem = booking ? MEMBERS.find(m=>m.id===booking.memberId) : null;
            const mine = isMine(booking);
            return <div key={slot} style={{display:"flex",alignItems:"center",gap:10,background:mine?T.teal10:T.white,border:`1px solid ${mine?T.teal20:T.g200}`,borderRadius:10,padding:"10px 14px",boxShadow:"0 1px 2px rgba(0,0,0,0.03)"}}>
              <span style={{width:46,fontSize:13,fontWeight:700,color:mine?T.teal:booking?T.g400:T.g600,flexShrink:0}}>{slot}</span>
              {mine ? <>
                <Pill label="Yours" color={T.teal}/>
                {booking.recurring&&<Pill label="Weekly" color={T.purple}/>}
                <span style={{flex:1,fontSize:11,color:T.g400}}>your booking</span>
                <button onClick={()=>cancelBooking(sel,day,slot)} style={{background:"none",border:"none",color:T.red,fontSize:12,fontWeight:600}}>Cancel</button>
              </> : booking ? <>
                <Av m={mem||{initials:"?",color:T.g400,bg:T.g100}} size={22}/>
                <span style={{fontSize:12,color:T.g500,flex:1}}>{mem?.short||"?"}'s booking{booking.recurring?" · weekly":""}</span>
                <Pill label="Booked" color={T.g400}/>
              </> : <>
                <span style={{fontSize:12,color:T.g300,flex:1}}>Available</span>
                <button onClick={()=>setBookModal(slot)} style={{background:T.teal,border:"none",borderRadius:8,padding:"6px 14px",color:T.white,fontSize:12,fontWeight:700}}>Book</button>
              </>}
            </div>;
          })}
        </div>
      </div>
    </>}

    {tabView==="all"&&<div style={{padding:"12px 16px 0"}}>
      {/* Summary by member */}
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        {MEMBERS.map(m=>{
          const cnt=allBookings.filter(b=>b.memberId===m.id).length;
          return <Card key={m.id} style={{flex:1,padding:"10px 8px",textAlign:"center"}}>
            <Av m={m} size={28}/>
            <div style={{fontSize:16,fontWeight:800,color:m.color,marginTop:6}}>{cnt}</div>
            <div style={{fontSize:10,color:T.g400,marginTop:1}}>{m.short}</div>
          </Card>;
        })}
      </div>

      {/* Filter by amenity */}
      <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:12}}>
        <button onClick={()=>setSel("all")} style={{background:sel==="all"?T.teal:T.white,border:`1.5px solid ${sel==="all"?T.teal:T.g200}`,borderRadius:20,padding:"6px 14px",color:sel==="all"?T.white:T.g600,fontSize:12,fontWeight:600,flexShrink:0}}>All</button>
        {amenities.map(a=><button key={a.id} onClick={()=>setSel(a.id)} style={{background:sel===a.id?T.teal:T.white,border:`1.5px solid ${sel===a.id?T.teal:T.g200}`,borderRadius:20,padding:"6px 14px",color:sel===a.id?T.white:T.g600,fontSize:12,fontWeight:600,flexShrink:0}}>{a.label}</button>)}
      </div>

      {/* Grouped by day */}
      {DAYS.map(d=>{
        const dayBks = allBookings.filter(b=>b.day===d && (sel==="all"||b.amenityId===sel));
        if(!dayBks.length) return null;
        return <div key={d} style={{marginBottom:16}}>
          <div style={{fontSize:12,fontWeight:700,color:T.g500,marginBottom:8,display:"flex",alignItems:"center",gap:8}}>
            <span>{d}</span>
            <span style={{width:1,height:12,background:T.g200,display:"inline-block"}}/>
            <span style={{color:T.g400,fontWeight:400}}>{dayBks.length} booking{dayBks.length>1?"s":""}</span>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {dayBks.map(bk=>{
              const mine=bk.memberId===meId;
              return <Card key={bk.key} style={{border:`1px solid ${mine?T.teal20:T.g200}`}}>
                <div style={{padding:"11px 14px",display:"flex",alignItems:"center",gap:12}}>
                  <div style={{width:42,height:42,borderRadius:10,background:mine?T.teal10:T.g50,border:`1px solid ${mine?T.teal20:T.g200}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                    <span style={{color:mine?T.teal:T.g400}}><TopicIcon id={amenities.find(a=>a.id===bk.amenityId)?.icon||"living"} size={18}/></span>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600,color:T.g800}}>{bk.amenityLabel} · {bk.slot}</div>
                    <div style={{display:"flex",alignItems:"center",gap:6,marginTop:3}}>
                      <div style={{width:8,height:8,borderRadius:"50%",background:bk.memberColor,flexShrink:0}}/>
                      <span style={{fontSize:12,color:T.g500}}>{mine?"You ("+me.name+")":bk.memberName}</span>
                      {bk.recurring&&<Pill label="Weekly" color={T.purple}/>}
                    </div>
                  </div>
                  {mine&&<button onClick={()=>cancelBooking(bk.amenityId,bk.day,bk.slot)} style={{color:T.red,background:"none",border:"none",fontSize:12,fontWeight:600,flexShrink:0}}>Cancel</button>}
                </div>
              </Card>;
            })}
          </div>
        </div>;
      })}
      {allBookings.filter(b=>sel==="all"||b.amenityId===sel).length===0&&
        <div style={{textAlign:"center",color:T.g400,fontSize:13,padding:"32px 0"}}>No bookings yet this week.</div>}
    </div>}

    {/* Book modal */}
    {bookModal&&<div style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.55)",display:"flex",alignItems:"flex-end",zIndex:200}} onClick={()=>setBookModal(null)}>
      <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:430,margin:"0 auto",background:T.white,borderRadius:"20px 20px 0 0",padding:"24px 24px 36px",boxShadow:"0 -8px 40px rgba(0,0,0,0.18)"}}>
        <div style={{width:40,height:4,borderRadius:2,background:T.g200,margin:"0 auto 20px"}}/>
        <div style={{fontSize:17,fontWeight:700,color:T.g900,marginBottom:4}}>Book {amenities.find(a=>a.id===sel)?.label}</div>
        <div style={{fontSize:13,color:T.g400,marginBottom:20}}>{day} · {bookModal}</div>

        <div style={{background:T.teal10,border:`1px solid ${T.teal20}`,borderRadius:12,padding:"12px 16px",marginBottom:16}}>
          <div style={{fontSize:12,color:T.g500,marginBottom:6}}>Booking for</div>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:32,height:32,borderRadius:"50%",background:T.teal10,border:`2px solid ${T.teal}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:T.teal}}>{me.initials}</div>
            <span style={{fontSize:14,fontWeight:600,color:T.g800}}>{me.name}</span>
          </div>
        </div>

        {/* Recurring toggle */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 16px",background:T.g50,borderRadius:12,marginBottom:20}}>
          <div>
            <div style={{fontSize:14,fontWeight:600,color:T.g800}}>Repeat weekly</div>
            <div style={{fontSize:12,color:T.g400,marginTop:2}}>Book this slot every {SHORT_DAYS[dayIdx]}</div>
          </div>
          <button onClick={()=>setRecurring(r=>!r)} style={{width:48,height:26,borderRadius:13,background:recurring?T.teal:T.g300,border:"none",position:"relative",transition:"background 0.2s",cursor:"pointer",flexShrink:0}}>
            <div style={{width:20,height:20,borderRadius:"50%",background:T.white,position:"absolute",top:3,left:recurring?25:3,transition:"left 0.2s",boxShadow:"0 1px 3px rgba(0,0,0,0.18)"}}/>
          </button>
        </div>

        <button onClick={()=>doBook(bookModal,recurring)} style={{width:"100%",background:T.teal,border:"none",borderRadius:12,padding:"14px",color:T.white,fontSize:15,fontWeight:700}}>
          Confirm Booking{recurring?" · Every "+SHORT_DAYS[dayIdx]:""}
        </button>
        <button onClick={()=>setBookModal(null)} style={{width:"100%",background:"none",border:"none",color:T.g400,fontSize:14,fontWeight:500,padding:"12px",marginTop:4}}>Cancel</button>
      </div>
    </div>}
  </div>;
}


// ── APP ───────────────────────────────────────────────────────────────────────
const NAV=[
  {id:"home",      label:"Home",      icon:Icon.home},
  {id:"agreement", label:"Agreement", icon:Icon.agreement},
  {id:"chores",    label:"Chores",    icon:Icon.chores},
  {id:"expenses",  label:"Expenses",  icon:Icon.expenses},
  {id:"amenities", label:"Amenities", icon:Icon.amenities},
];

function App() {
  const [screen,      setScreen]      = useState("onboarding");
  const [currentUser, setCurrentUser] = useState({name:"Leticia",initials:"LL"});
  const [members,     setMembers]     = useState(MEMBERS_DEFAULT);
  // Agreement state lifted here so it persists across navigation
  const [agreeMap,     setAgreeMap]     = useState({});
  const [customTopics, setCustomTopics] = useState([]);
  const noNav = screen==="onboarding"||screen==="join";
  // Computed: is the agreement fully complete?
  const allTopics = [...AGREEMENT_TOPICS_DEF, ...customTopics.map(t=>({...t,icon:"bill",options:[],isCustom:true}))];
  const agreementDone = allTopics.length > 0 && allTopics.every(t => agreeMap[t.id]);

  // Called by Onboard when "All joined — Go to Dashboard" is tapped
  // payload = { name, cnt, members, household, city }
  function handleOnboardDone(payload) {
    if (payload && typeof payload === "object" && payload.name) {
      const n = payload.name.trim();
      const initials = n.split(" ").filter(Boolean).map(w=>w[0]).join("").toUpperCase().slice(0,2) || n.slice(0,2).toUpperCase();
      setCurrentUser({name:n, initials});
      if (payload.members && payload.members.length > 0) setMembers(payload.members);
    }
    setScreen("home");
  }

  // Called by JoinFlow when someone joins via invite link
  function handleJoin(name) {
    const n = (name||"").trim();
    if (!n) { setScreen("home"); return; }
    const initials = n.split(" ").filter(Boolean).map(w=>w[0]).join("").toUpperCase().slice(0,2) || n.slice(0,2).toUpperCase();
    setCurrentUser({name:n, initials});
    setScreen("home");
  }

  const screens={
    onboarding:<Onboard go={handleOnboardDone}/>,
    join:<JoinFlow go={handleJoin}/>,
    home:<Home go={setScreen} currentUser={currentUser} members={members} agreementDone={agreementDone} agreeMap={agreeMap} allTopics={allTopics}/>,
    agreement:<Agreement members={members} agreeMapProp={agreeMap} setAgreeMapProp={setAgreeMap} customTopicsProp={customTopics} setCustomTopicsProp={setCustomTopics}/>,
    chores:<Chores members={members}/>,
    expenses:<Expenses members={members}/>,
    amenities:<Amenities currentUser={currentUser} members={members}/>,
  };

  return <div style={{background:T.g50,minHeight:"100vh",color:T.g900}}>
    <div style={{background:T.white,borderBottom:`1px solid ${T.g100}`,padding:"10px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <span style={{fontSize:13,fontWeight:700,color:T.g900}}>9:41</span>
      <span style={{fontSize:14,fontWeight:800,color:T.teal,letterSpacing:-0.3}}>RoomSync</span>
      <div style={{display:"flex",gap:6,alignItems:"center"}}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={T.g400} strokeWidth="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20" strokeWidth="3" strokeLinecap="round"/></svg>
        <svg width="14" height="14" viewBox="0 0 24 24" fill={T.g400} stroke="none"><path d="M17 21H7c0-2.76 2.24-5 5-5s5 2.24 5 5zm5-11H2v2h20v-2zM22 5H2v2h20V5z"/><rect x="3" y="2" width="18" height="20" rx="2" fill="none" stroke={T.g400} strokeWidth="2"/></svg>
      </div>
    </div>
    <div style={{overflowY:"auto",height:noNav?"calc(100vh - 44px)":"calc(100vh - 100px)"}}>{screens[screen]||screens.home}</div>
    {!noNav&&<div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:T.white,borderTop:`1px solid ${T.g100}`,display:"flex",zIndex:100,boxShadow:"0 -4px 20px rgba(0,0,0,0.07)"}}>
      {NAV.map(n=><button key={n.id} onClick={()=>setScreen(n.id)} style={{flex:1,padding:"9px 4px 11px",background:"none",border:"none",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
        <span style={{color:screen===n.id?T.teal:T.g300,opacity:screen===n.id?1:1}}>{n.icon}</span>
        <span style={{fontSize:10,fontWeight:screen===n.id?700:400,color:screen===n.id?T.teal:T.g400}}>{n.label}</span>
        {screen===n.id&&<div style={{width:20,height:3,borderRadius:99,background:T.teal}}/>}
      </button>)}
    </div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
